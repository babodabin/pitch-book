<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>구종 도감</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070c">
<link rel="apple-touch-icon" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { background:#05070c; }
  body {
    font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;
    color:#dfe3e8;
    user-select:none; -webkit-user-select:none;
    padding-top:max(env(safe-area-inset-top), 10px);
    padding-bottom:max(env(safe-area-inset-bottom), 16px);
  }
  #page { max-width:560px; margin:0 auto; }
  header {
    padding:8px 16px 10px 16px;
    display:flex; align-items:baseline; gap:10px;
    background:linear-gradient(180deg, rgba(90,143,212,0.10), transparent);
  }
  header h1 {
    font-family:'Special Elite', monospace; font-size:23px; font-weight:400;
    letter-spacing:0.14em; color:#fff;
    text-shadow:0 0 14px rgba(120,170,255,0.45);
  }
  header .sub { font-size:13px; color:#7a8290; }

  #pitch-bar {
    display:flex; gap:8px; overflow-x:auto; padding:4px 16px 10px 16px;
    -webkit-overflow-scrolling:touch;
  }
  #pitch-bar::-webkit-scrollbar { display:none; }
  .p-chip {
    flex:0 0 auto;
    font-size:16px; font-weight:700;
    padding:10px 16px 10px 13px; border-radius:24px;
    background:#10141d; border:1.5px solid #2a3242; color:#aab2c0;
    display:flex; align-items:center; gap:7px;
  }
  .p-chip:active { transform:scale(0.95); }
  .p-chip::before {
    content:''; width:9px; height:9px; border-radius:50%;
    background:var(--c); box-shadow:0 0 6px var(--c);
  }
  .p-chip.on {
    border-color:var(--c); color:#fff;
    background:linear-gradient(180deg, rgba(255,255,255,0.07), rgba(0,0,0,0));
    box-shadow:0 0 12px color-mix(in srgb, var(--c) 45%, transparent);
  }

  #info {
    padding:2px 16px 8px 16px;
    display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  }
  #p-name { font-size:24px; font-weight:800; }
  #p-speed { font-size:16px; color:#8a93a3; font-weight:600; }

  #tabs { display:flex; gap:8px; padding:0 16px 10px 16px; }
  .tab {
    flex:1; text-align:center;
    font-size:16px; font-weight:700;
    padding:11px 0; border-radius:12px;
    background:#10141d; border:1.5px solid #2a3242; color:#aab2c0;
  }
  .tab.on {
    background:linear-gradient(180deg, #243150, #1b2433);
    border-color:#5a8fd4; color:#fff;
    box-shadow:0 0 10px rgba(90,143,212,0.35);
  }

  #cmp-bar {
    display:none; gap:6px; overflow-x:auto; padding:0 16px 8px 16px;
    -webkit-overflow-scrolling:touch; align-items:center;
  }
  #cmp-bar::-webkit-scrollbar { display:none; }
  #cmp-bar .cmp-lb { flex:0 0 auto; font-size:12px; color:#8a93a3; font-weight:700; margin-right:2px; }
  .c-chip {
    flex:0 0 auto; font-size:13px; font-weight:700;
    padding:6px 11px; border-radius:16px;
    background:#10141d; border:1.5px solid #2a3242; color:#aab2c0;
  }
  .c-chip.on { border-color:var(--c,#5a8fd4); color:#fff;
    box-shadow:0 0 8px color-mix(in srgb, var(--c,#5a8fd4) 45%, transparent); }

  #canvas-box {
    position:relative; margin:0 12px; height:54vh; min-height:340px;
    border-radius:14px; overflow:hidden; border:1.5px solid #222b3a;
  }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #hand-wrap {
    position:absolute; top:10px; right:10px;
    display:flex; flex-direction:column; gap:7px; align-items:flex-end;
  }
  #hand-btn, #bat-btn {
    font-size:14px; font-weight:800;
    padding:9px 14px; border-radius:20px;
    background:rgba(10,16,28,0.85); border:1.5px solid #3a4660; color:#cfd6e4;
    backdrop-filter:blur(4px);
  }
  #hand-btn:active, #bat-btn:active { transform:scale(0.94); }
  #matchup {
    position:absolute; left:10px; top:10px;
    font-size:13px; font-weight:700;
    padding:7px 12px; border-radius:10px;
    background:rgba(10,16,28,0.85); border:1.5px solid #3a4660; color:#dfe3e8;
    backdrop-filter:blur(4px); line-height:1.4;
  }
  #matchup .tag { font-size:11px; color:#7a8290; font-weight:600; }

  #controls { display:flex; gap:10px; padding:12px 16px 8px 16px; }
  .mode-btn {
    flex:1; font-size:17px; font-weight:800; letter-spacing:0.04em;
    padding:15px 0; border-radius:13px; border:none;
  }
  .mode-btn:active { transform:translateY(2px); }
  .mode-btn.active { outline:2px solid rgba(255,255,255,0.28); box-shadow:0 0 14px rgba(120,170,255,0.22); }
  #real-btn { background:#fff; color:#000; }
  #study-btn { background:#1b2433; color:#ffd23b; border:1.5px solid #4a4020; }

  #detail { padding:6px 16px 30px 16px; }
  .d-card {
    background:#0d1320; border:1.5px solid #1f2940; border-radius:14px;
    padding:15px 16px; margin-bottom:10px;
  }
  .d-card .lb { font-size:13px; font-weight:800; letter-spacing:0.08em; color:#5a8fd4; margin-bottom:6px; }
  .d-card .tx { font-size:16px; line-height:1.65; color:#cdd4e0; }
  .d-card.use .lb { color:#52e07a; }
  .d-card.course .lb { color:#ff9a3d; }
</style>
</head>
<body>
<div id="page">
  <header>
    <h1>PITCH BOOK</h1>
    <div class="sub">구종 도감</div>
  </header>
  <div id="pitch-bar"></div>
  <div id="info">
    <div id="p-name"></div>
    <div id="p-speed"></div>
  </div>
  <div id="tabs">
    <div class="tab on" data-v="front">타자 시점</div>
    <div class="tab" data-v="side">움직임 분석</div>
    <div class="tab" data-v="grip">그립</div>
  </div>
  <div id="cmp-bar"><span class="cmp-lb">비교</span></div>
  <div id="canvas-box">
    <canvas id="cv"></canvas>
    <div id="hand-wrap">
      <button id="hand-btn">🔵 우투수</button>
      <button id="bat-btn">🔴 우타자</button>
    </div>
    <div id="matchup"></div>
  </div>
  <div id="controls">
    <button class="mode-btn" id="real-btn">실전 ▶ 실제 속도</button>
    <button class="mode-btn" id="study-btn">학습 ▶ 이해하기</button>
  </div>
  <div id="detail">
    <div class="d-card"><div class="lb">특징</div><div class="tx" id="d-desc"></div></div>
    <div class="d-card use"><div class="lb">용도 — 왜 던지나</div><div class="tx" id="d-use"></div></div>
    <div class="d-card course"><div class="lb" id="d-course-lb">추천 코스</div><div class="tx" id="d-course"></div></div>
    <div class="d-card"><div class="lb">회전</div><div class="tx" id="d-spin"></div></div>
  </div>
</div>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
<script>
(function(){
  if(!CanvasRenderingContext2D.prototype.roundRect){
    CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
      r=Math.min(Number(r)||0,Math.abs(w)/2,Math.abs(h)/2);
      this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.quadraticCurveTo(x+w,y,x+w,y+r);
      this.lineTo(x+w,y+h-r);this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
      this.lineTo(x+r,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r);
      this.lineTo(x,y+r);this.quadraticCurveTo(x,y,x+r,y);this.closePath();return this;
    };
  }
  // ───────── 실제 치수 (미터) ─────────
  const MOUND_DIST=18.44;       // 투구판 → 홈플레이트
  const RELEASE_D=17.0;         // 릴리스 지점 → 플레이트 (익스텐션 반영)
  const CAM_BEHIND=1.3;         // 카메라(타자 눈) 플레이트 뒤 거리
  const EYE_H=1.35;             // 타자 눈높이
  const BALL_R_M=0.0365;        // 공 반지름 7.3cm/2
  const ZONE_W=0.43;            // 존 폭
  const ZONE_BOT=0.50, ZONE_TOP=1.05;
  const PITCHER_H=1.85, MOUND_H=0.25;
  const REL_H=1.75;             // 릴리스 높이

  // 무브먼트 = 무회전 궤적(중력만) 대비 편차 — ABS/스탯캐스트와 같은 정의

     spinTxt:'분당 2300회 강한 백스핀. 덜 떨어져서 타자 눈엔 떠오르는 것처럼 보입니다.',
     desc:'야구의 기본이자 가장 빠른 공. 회전이 공을 받쳐줘서 거의 직선으로 옵니다.',
     use:'카운트 잡기, 정면 승부, 그리고 변화구를 살리는 기준점. 모든 수싸움은 "직구냐 아니냐"에서 시작됩니다.',

     course:{RR:'우타자 바깥쪽. 직구인 줄 알고 나온 배트의 끝을 살짝 벗어나 빗맞게 만듭니다.',
      RL:'좌타자 몸쪽 — 커터의 교과서. 손잡이를 파고들어 배트를 부러뜨립니다(리베라의 그 공).',
      LR:'우타자 몸쪽. 좌투 커터가 우타자 손잡이를 파고드는 코스.',

    {key:'slider', name:'슬라이더', color:'#ff9a3d', v:135, bx:-0.35, mv:0.05, shape:'late',

     gripType:'curve', gripTxt:'검지·중지를 바짝 모으고 중지를 실밥에 깊게 겁니다. 엄지는 반대쪽 실밥을 받칩니다. 릴리스 때 손목을 안에서 밖으로 엎으며 탑스핀을 강하게 줍니다.',

  // ───────── DOM ─────────

  // 학습 모드는 단순 감속이 아니라 구종의 핵심 변화 구간을 설명한다.
  const STUDY_GUIDES={
    '4seam':  {breakAt:0.62, short:'끝까지 곧게', cue:'중력보다 덜 떨어져 떠오르는 느낌'},

  // ───────── 원근 투영 (타자 시점) ─────────
  // 존 폭이 화면의 46%가 되도록 줌 설정 → 모든 크기가 같은 자로 그려짐
  function proj(X, Y, d){
    // X: 좌우 m (+=화면 오른쪽/1루쪽), Y: 높이 m, d: 플레이트로부터 거리 m
    const dist=d+CAM_BEHIND;
    const S=(W*0.46/ZONE_W)*(CAM_BEHIND/dist)*(1+0/1);
    const HOR=H*0.34;   // 눈높이(지평선) 화면 위치
    return {
      x: W/2 + X*S,
      y: HOR + (EYE_H-Y)*S,
      s: S
    };
  }

  const bar=$('pitch-bar');

  function updateMatchup(){
    $('hand-btn').textContent = lefty? '🔵 좌투수':'🔵 우투수';
    $('bat-btn').textContent  = batLefty? '🔴 좌타자':'🔴 우타자';

      ? '같은 손 (슬라이더·스위퍼가 가장 위력적)'

  function doThrow(m){
    mode=m;
    $('real-btn').classList.toggle('active', mode==='real');
    $('study-btn').classList.toggle('active', mode==='study');
    if(view==='grip'){ throwT=-1; return; }
    throwT=performance.now()+600;
    knSeed=Math.random()*1000;
    trail=[];
    path=[];
    pathDone=false;
    absCross=null;
  }

  function flightDur(){
    const real=RELEASE_D/(cur.v/3.6)*1000;
    // 실전은 실제 도달시간, 학습은 약 3.5~4초 동안 핵심 구간을 충분히 보여준다.
    return mode==='real' ? real : Math.max(3500, real*8.5);
  }

  function knWobble(t, seed){
    return {
      x: Math.sin(t*9+seed)*0.5 + Math.sin(t*23+seed*2)*0.3,
      y: Math.cos(t*7+seed)*0.4 + Math.sin(t*17+seed*3)*0.25
    };
  }

  // ───────── 물리 기반 궤적 (ABS/스탯캐스트와 같은 모델) ─────────
  // 공 = 등가속 운동: 위치(t) = 릴리스 + v0·t + ½a·t²
  //  · a = 중력(-9.81) + 마그누스(회전) 가속도
  //  · 마그누스 가속도는 구종별 무브먼트(bx, mv)에서 역산: a_M = 2·무브먼트/T²
  //  · v0는 목표 코스를 맞추도록 역산 (투수의 에이밍)
  //  → 변화가 t²로 누적되므로 "끝에서 급격히 꺾이는" 실제 궤적이 저절로 나온다
  const G=9.81;
  function ballWorldFor(p, tN, seed){
    const sgn=lefty?-1:1;
    const relX=-0.45*sgn;
    const T=RELEASE_D/(p.v/3.6);
    const t=tN*T;
    const d=RELEASE_D*(1-tN);
    const ax=2*(p.bx*sgn)/(T*T);
    const ay=2*(p.mv||0)/(T*T) - G;
    const v0x=(p.tx*sgn - relX)/T - 0.5*ax*T;
    const v0y=(p.ty - REL_H)/T - 0.5*ay*T;

    // 회전이 없다면 향했을 기준선. 여기에서 구종별 무브먼트가 갈라진다.
    const X0=relX + v0x*t;
    const Y0=REL_H + v0y*t - 0.5*G*t*t;
    let moveT=tN*tN;
    if(p.shape==='late') moveT=Math.pow(tN,3.65);
    else if(p.shape==='early') moveT=Math.pow(tN,1.38);
    else if(p.shape==='gradual') moveT=Math.pow(tN,2.05);

    let X=X0+(p.bx*sgn)*moveT;
    let Y=Y0+(p.mv||0)*moveT;
    if(p.shape==='knuckle'){
      const wb=knWobble(tN, seed);
      X+=wb.x*0.25*tN; Y+=wb.y*0.22*tN;
    }
    return {X:X, Y:Y, d:d, X0:X0, Y0:Y0};
  }
  function ballWorld(tN){ return ballWorldFor(cur, tN, knSeed); }
  function flightT(p){ return RELEASE_D/(p.v/3.6); }

  // ───────── ABS 자동 판정 (Automatic Ball-Strike) ─────────
  // 공 일부라도 존에 걸치면 스트라이크 — 공 반지름 포함 판정
  function setABS(X,Y){
    const R=BALL_R_M;
    const strike = Math.abs(X)<=ZONE_W/2+R && Y>=ZONE_BOT-R && Y<=ZONE_TOP+R;
    absCross={X:X, Y:Y, strike:strike};
  }
  function judgeABS(){
    if(absCross) return;
    const w=ballWorld(1);   // 플레이트 도달(d=0) 시점
    setABS(w.X, w.Y);
  }
  function pushPath(w){
    path.push({X:w.X, Y:w.Y, d:w.d, X0:w.X0, Y0:w.Y0});
    if(!absCross && path.length>1){
      const a=path[path.length-2], b=path[path.length-1];
      if(a.d>0 && b.d<=0){   // 플레이트 통과 프레임 — 정확한 통과점 보간
        const f=a.d/(a.d-b.d);
        setABS(a.X+(b.X-a.X)*f, a.Y+(b.Y-a.Y)*f);
      }
    }
  }

  function releaseT(t){
    if(throwT<0) return null;
    const e=t-throwT;
    if(e<0) return null;
    const dur=flightDur();
    const over = mode==='real' ? 1.10 : 1.0;
    const raw=e/dur;
    if(raw>over) return 'done';
    if(mode==='real') return raw;

    // 학습 타임라인: 출발 → 변화 시작 → 홈 앞 결정 구간을 차례로 천천히 본다.
    const g=STUDY_GUIDES[cur.key]||{breakAt:0.55};
    const b=Math.max(0.30,Math.min(0.74,g.breakAt));
    const ease=x=>x*x*(3-2*x);
    let tN;
    if(raw<0.22) tN=0.30*ease(raw/0.22);
    else if(raw<0.55) tN=0.30+(b-0.30)*ease((raw-0.22)/0.33);
    else if(raw<0.78) tN=b+(Math.min(0.90,b+0.16)-b)*ease((raw-0.55)/0.23);
    else tN=Math.min(0.90,b+0.16)+(1-Math.min(0.90,b+0.16))*ease((raw-0.78)/0.22);
    return Math.min(1,tN);
  }

  function drawArrow(x1,y1,x2,y2,color){
    const a=Math.atan2(y2-y1,x2-x1), head=7;
    ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2-Math.cos(a-0.55)*head,y2-Math.sin(a-0.55)*head);
    ctx.lineTo(x2-Math.cos(a+0.55)*head,y2-Math.sin(a+0.55)*head);
    ctx.closePath(); ctx.fill();
  }

  function drawStudyCoachFront(tN,w){
    if(mode!=='study' || !w) return;
    const g=STUDY_GUIDES[cur.key]||{breakAt:0.55,short:'움직임 관찰',cue:'기준선과 실제 궤적의 차이를 본다'};
    let phase='① 출발 — 직구처럼 보이는 구간';
    if(tN>=g.breakAt && tN<0.88) phase='② 변화 시작 — '+g.short;
    else if(tN>=0.88) phase='③ 홈 앞 결정 — '+g.cue;

    ctx.save();
    const bw=Math.min(W-42,330), bh=44, bx=(W-bw)/2, by=H*0.19;
    ctx.fillStyle='rgba(5,9,17,0.82)';
    ctx.strokeStyle=cur.color; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,12); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='800 13px -apple-system,sans-serif'; ctx.textAlign='center';
    ctx.fillText(phase,W/2,by+18);
    ctx.fillStyle='rgba(225,232,242,0.72)'; ctx.font='600 11px -apple-system,sans-serif';
    ctx.fillText('점선 = 회전 없음 · 색 선 = 실제 움직임',W/2,by+34);

    // 같은 거리에서 기준선과 실제 공의 차이를 화살표로 표시한다.
    const dC=Math.max(w.d,-CAM_BEHIND*0.65);
    const a=proj(w.X0,w.Y0,dC), b=proj(w.X,w.Y,dC);
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy);
    if(tN>0.28 && len>2.2){
      const scale=Math.min(2.3,Math.max(1.25,22/len));
      drawArrow(a.x,a.y,a.x+dx*scale,a.y+dy*scale,cur.color);
      ctx.fillStyle=cur.color; ctx.font='800 11px -apple-system,sans-serif';
      ctx.textAlign=dx>=0?'left':'right';
      ctx.fillText('회전이 만든 이동',a.x+dx*scale+(dx>=0?7:-7),a.y+dy*scale-7);
    }

    // 변화가 시작되는 위치를 링으로 고정해, 어디서 갈라지는지 기억하게 한다.
    if(tN>=g.breakAt-0.03){
      const q=ballWorldFor(cur,g.breakAt,knSeed);
      const qp=proj(q.X,q.Y,Math.max(q.d,-CAM_BEHIND*0.65));
      ctx.strokeStyle=cur.color; ctx.globalAlpha=0.75; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(qp.x,qp.y,7,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=1; ctx.fillStyle='#fff'; ctx.font='700 10px -apple-system,sans-serif';
      ctx.textAlign='center'; ctx.fillText('변화 시작',qp.x,qp.y-11);
    }
    ctx.restore();
  }

  // ───────── 타자 시점 ─────────
  function drawFront(t){
    // 하늘
    const sky=ctx.createLinearGradient(0,0,0,H*0.40);
    sky.addColorStop(0,'#060a14');
    sky.addColorStop(1,'#10203a');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H*0.40);
    // 그라운드 (지평선 = 눈높이 부근)
    const HOR=H*0.34;
    const gr=ctx.createLinearGradient(0,HOR,0,H);
    gr.addColorStop(0,'#16321f');
    gr.addColorStop(1,'#0c1d12');
    ctx.fillStyle=gr; ctx.fillRect(0,HOR,W,H-HOR);
    // 잔디 깎기 줄무늬 — 원근 간격의 밝고 어두운 띠 (깊이감의 핵심)
    for(let i=0;i<9;i++){
      const p0=proj(0,0,i*2), p1=proj(0,0,i*2+2);
      ctx.fillStyle = i%2 ? 'rgba(255,255,255,0.032)' : 'rgba(0,0,0,0.075)';
      ctx.fillRect(0, p1.y, W, p0.y-p1.y);
    }
    // 파울라인 (좌우로 뻗는 소실선 — 원근 강조)
    ctx.strokeStyle='rgba(255,255,255,0.10)';
    ctx.lineWidth=2;
    for(const s of [-1,1]){
      const q0=proj(s*0.6,0,0.5), q1=proj(s*17,0,17);
      ctx.beginPath(); ctx.moveTo(q0.x,q0.y); ctx.lineTo(q1.x,q1.y); ctx.stroke();
    }
    // 홈플레이트 주변 흙 원
    {
      const hc=proj(0,0,0.35), hl=proj(-1.9,0,0.35);
      ctx.fillStyle='rgba(146,104,64,0.20)';
      ctx.beginPath();
      ctx.ellipse(hc.x,hc.y,Math.abs(hc.x-hl.x),Math.abs(hc.x-hl.x)*0.30,0,0,Math.PI*2);
      ctx.fill();
    }
    // 관중석 띠
    ctx.fillStyle='#0b1322';
    ctx.fillRect(0,HOR-H*0.085,W,H*0.085);
    ctx.fillStyle='rgba(255,235,180,0.32)';
    for(let i=0;i<36;i++){
      ctx.fillRect((i*61.7)%W, HOR-H*0.08+((i*37.3)%(H*0.06)), 2,2);
    }
    // 배터스아이 — 센터 담장의 검은 벽. 투수 뒤가 어두워야 공이 보인다 (실제 규정 요소)
    {
      const beW=W*0.30;
      ctx.fillStyle='#0d1d13';
      ctx.fillRect(W/2-beW/2, HOR-H*0.085, beW, H*0.085);
      ctx.strokeStyle='rgba(255,255,255,0.08)';
      ctx.lineWidth=1;
      ctx.strokeRect(W/2-beW/2, HOR-H*0.085, beW, H*0.085);
    }
    // 조명탑
    for(const lx of [W*0.12, W*0.88]){
      ctx.strokeStyle='rgba(180,190,210,0.5)';
      ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(lx,HOR-H*0.085); ctx.lineTo(lx,H*0.05); ctx.stroke();
      ctx.save();
      ctx.shadowColor='#fff8dc'; ctx.shadowBlur=12;
      ctx.fillStyle='#fff3c4';
      for(let r2=0;r2<2;r2++) for(let c2=-1;c2<=1;c2++)
        ctx.fillRect(lx+c2*9-3, H*0.03+r2*9, 6,6);
      ctx.restore();
    }

    // ── 같은 자(proj)로 그리는 무대 ──
    // 마운드 (18.44m 거리, 폭 5.5m)
    const mC=proj(0, MOUND_H, MOUND_DIST);
    const mL=proj(-2.75, MOUND_H, MOUND_DIST);
    ctx.beginPath();
    ctx.ellipse(mC.x, mC.y, Math.abs(mC.x-mL.x), Math.abs(mC.x-mL.x)*0.22, 0, 0, Math.PI*2);
    ctx.fillStyle='rgba(150,108,66,0.30)';
    ctx.fill();
    ctx.strokeStyle='rgba(200,160,110,0.65)';
    ctx.lineWidth=2;
    ctx.stroke();
    // 투수 (1.85m, 같은 자)
    drawPitcher(t);
    // 잔디 줄 (원근 간격)
    ctx.strokeStyle='rgba(255,255,255,0.05)';
    ctx.lineWidth=1.5;
    for(const dd of [4,7,11,15]){
      const p1=proj(-3,0,dd), p2=proj(3,0,dd);
      ctx.beginPath(); ctx.moveTo(0,p1.y); ctx.lineTo(W,p2.y); ctx.stroke();
      if(mode==='study'){
        ctx.fillStyle='rgba(255,255,255,0.22)';
        ctx.font='11px -apple-system,sans-serif';
        ctx.textAlign='left';
        ctx.fillText(dd+'m', 8, p1.y-4);
        ctx.strokeStyle='rgba(255,255,255,0.05)';
      }
    }
    // 스트라이크 존 — 입체 박스 (홈플레이트 앞변~뒤변, 깊이 0.43m)
    // 타자 눈엔 바닥에 비스듬히 선 사다리꼴로 보임 → 공간에 '서 있는' 느낌
    const zNear=0.0, zFar=0.43;                     // 플레이트 깊이
    const TLn=proj(-ZONE_W/2, ZONE_TOP, zNear), TRn=proj(ZONE_W/2, ZONE_TOP, zNear);
    const BLn=proj(-ZONE_W/2, ZONE_BOT, zNear), BRn=proj(ZONE_W/2, ZONE_BOT, zNear);
    const TLf=proj(-ZONE_W/2, ZONE_TOP, zFar), TRf=proj(ZONE_W/2, ZONE_TOP, zFar);
    const BLf=proj(-ZONE_W/2, ZONE_BOT, zFar), BRf=proj(ZONE_W/2, ZONE_BOT, zFar);
    // 뒷면 (먼 쪽, 흐리게)
    ctx.strokeStyle='rgba(255,255,255,0.16)';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(TLf.x,TLf.y); ctx.lineTo(TRf.x,TRf.y); ctx.lineTo(BRf.x,BRf.y); ctx.lineTo(BLf.x,BLf.y); ctx.closePath();
    ctx.stroke();
    // 옆면 연결선 (깊이)
    ctx.strokeStyle='rgba(255,255,255,0.13)';
    ctx.beginPath();
    ctx.moveTo(TLn.x,TLn.y); ctx.lineTo(TLf.x,TLf.y);
    ctx.moveTo(TRn.x,TRn.y); ctx.lineTo(TRf.x,TRf.y);
    ctx.moveTo(BLn.x,BLn.y); ctx.lineTo(BLf.x,BLf.y);
    ctx.moveTo(BRn.x,BRn.y); ctx.lineTo(BRf.x,BRf.y);
    ctx.stroke();
    // 앞면 (가까운 쪽, 선명) — 9분할
    ctx.strokeStyle='rgba(255,255,255,0.4)';
    ctx.setLineDash([7,6]);
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(TLn.x,TLn.y); ctx.lineTo(TRn.x,TRn.y); ctx.lineTo(BRn.x,BRn.y); ctx.lineTo(BLn.x,BLn.y); ctx.closePath();
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle='rgba(255,255,255,0.1)';
    ctx.lineWidth=1;
    const lerp=(a,b,t)=>({x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t});
    ctx.beginPath();
    for(const t of [1/3,2/3]){
      const tp=lerp(TLn,TRn,t), bp=lerp(BLn,BRn,t);
      ctx.moveTo(tp.x,tp.y); ctx.lineTo(bp.x,bp.y);
      const lp=lerp(TLn,BLn,t), rp=lerp(TRn,BRn,t);
      ctx.moveTo(lp.x,lp.y); ctx.lineTo(rp.x,rp.y);
    }
    ctx.stroke();
    // 홈플레이트 — 입체 오각형 (지면에 누운)
    const pFL=proj(-ZONE_W/2,0,zFar), pFR=proj(ZONE_W/2,0,zFar);
    const pML=proj(-ZONE_W/2,0,zNear), pMR=proj(ZONE_W/2,0,zNear);
    const pTip=proj(0,0,-0.21);
    ctx.strokeStyle='rgba(255,255,255,0.5)';
    ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.moveTo(pFL.x,pFL.y); ctx.lineTo(pFR.x,pFR.y); ctx.lineTo(pMR.x,pMR.y);
    ctx.lineTo(pTip.x,pTip.y); ctx.lineTo(pML.x,pML.y); ctx.closePath();
    ctx.stroke();

    // 포수 미트 — 목표 코스에 타깃을 대고 기다림 (공이 '어디로 가는지' 공간 단서)
    drawMitt();

    // ── 타자 실루엣 (좌/우타석 위치 표시) ──
    // 우타자는 3루쪽(화면 왼쪽, X음수), 좌타자는 1루쪽(화면 오른쪽, X양수)
    drawBatter();

    // 공
    const rel=releaseT(t);

    // ── 영구 궤적: 도착했어도 path가 있으면 항상 전체를 그린다 ──
    function drawPath(){
      if(path.length<2) return;
      // 0) 무회전 기준 궤적 — 같은 릴리스에서 회전이 없었다면 (중력만). 점선과의 간격 = 무브먼트
      ctx.save();
      ctx.globalAlpha=0.35;
      ctx.strokeStyle='rgba(255,255,255,0.6)';
      ctx.lineWidth=1.5;
      ctx.setLineDash([4,5]);
      ctx.beginPath();
      for(let i=0;i<path.length;i++){
        if(path[i].X0===undefined) continue;
        const dC=Math.max(path[i].d,-CAM_BEHIND*0.7);
        const sp=proj(path[i].X0,path[i].Y0,dC);
        i?ctx.lineTo(sp.x,sp.y):ctx.moveTo(sp.x,sp.y);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
      // 점선 범례
      ctx.save();
      ctx.fillStyle='rgba(255,255,255,0.30)';
      ctx.font='10px -apple-system,sans-serif';
      ctx.textAlign='left';
      ctx.fillText('- - 회전 없었다면 (중력만)', 10, H-16);
      ctx.restore();
      // 1) 지면 그림자 궤적 (입체감 — 공이 공중에 떠 있음을 바닥선으로)
      ctx.save();
      ctx.globalAlpha=0.5;
      ctx.strokeStyle='rgba(0,0,0,0.55)';
      ctx.lineWidth=2;
      ctx.beginPath();
      for(let i=0;i<path.length;i++){
        const dC=Math.max(path[i].d,-CAM_BEHIND*0.7);
        const sp=proj(path[i].X,0,dC);
        i?ctx.lineTo(sp.x,sp.y):ctx.moveTo(sp.x,sp.y);
      }
      ctx.stroke();
      ctx.restore();
      // 2) 공 궤적 본선 (구종 색, 거리에 따라 굵기 증가 → 다가오는 입체감)
      ctx.save();
      ctx.lineCap='round'; ctx.lineJoin='round';
      for(let i=1;i<path.length;i++){
        const dC=Math.max(path[i].d,-CAM_BEHIND*0.7);
        const a=proj(path[i-1].X,path[i-1].Y,Math.max(path[i-1].d,-CAM_BEHIND*0.7));
        const b=proj(path[i].X,path[i].Y,dC);
        ctx.globalAlpha=0.85;
        ctx.strokeStyle=cur.color;
        ctx.lineWidth=Math.max(1.5, BALL_R_M*b.s*0.9);
        ctx.beginPath();
        ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
        ctx.stroke();
        // 높이 연결선 (공중 깊이감)
        if(i%3===0){
          const sp=proj(path[i].X,0,dC);
          ctx.globalAlpha=0.13;
          ctx.lineWidth=1;
          ctx.beginPath();
          ctx.moveTo(b.x,b.y); ctx.lineTo(sp.x,sp.y);
          ctx.stroke();
        }
      }
      ctx.restore();
      ctx.globalAlpha=1;
    }

    if(rel==='done'){
      // 도착 후: 전체 궤적 + 최종 도착점 공을 계속 표시 (지우지 않음)
      pathDone=true;
      judgeABS();
      drawPath();
      if(path.length){
        const last=path[path.length-1];
        const dC=Math.max(last.d,-CAM_BEHIND*0.7);
        const p2=proj(last.X,last.Y,dC);
        const r2=Math.max(2,BALL_R_M*p2.s);
        drawBallSpin(p2.x,p2.y,r2,t);
        drawStudyCoachFront(1,last);
      }
      drawABS();
      return;
    }
    if(rel===null){
      // 던지기 전: 이전 궤적이 남아 있으면 유지
      if(pathDone){ drawPath(); drawABS(); }
      return;
    }

    const tN=rel;
    const w=ballWorld(tN);
    if(w.d < -CAM_BEHIND*0.7){ drawPath(); drawABS(); return; }   // 카메라 지나침
    // 비행 중 매 프레임 월드좌표 저장 (영구)
    pushPath(w);
    const p=proj(w.X, w.Y, Math.max(w.d, -CAM_BEHIND*0.7));
    const r=Math.max(2, BALL_R_M*p.s);
    // 그동안의 전체 궤적 먼저 그리기
    drawPath();
    // 잔상 — 실전 속도에서 공이 '쏘아져 오는' 스피드감
    if(mode==='real' && path.length>4){
      for(let g=1; g<=3; g++){
        const q=path[Math.max(0, path.length-1-g*2)];
        const gp=proj(q.X, q.Y, Math.max(q.d,-CAM_BEHIND*0.7));
        const gr=Math.max(2, BALL_R_M*gp.s);
        ctx.save();
        ctx.globalAlpha=0.18/g;
        ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(gp.x,gp.y,gr*0.95,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
    }
    if(absCross) drawABS();
    // 지면 그림자: 공이 공중에 '떠서' 오는 깊이감
    const sh=proj(w.X, 0, Math.max(w.d, -CAM_BEHIND*0.7));
    if(sh.y<H+30){
      ctx.save();
      ctx.globalAlpha=0.35;
      ctx.fillStyle='#000';
      ctx.beginPath();
      ctx.ellipse(sh.x, sh.y, r*1.5, r*0.45, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
    drawBallSpin(p.x,p.y,r,t);
    drawStudyCoachFront(tN,w);
  }

  function drawMitt(){
    const sgn=lefty?-1:1;
    const m=proj(cur.tx*sgn, cur.ty, 0.55);   // 존 뒤에서 타깃을 대는 위치
    const r=0.125*m.s;
    ctx.save();
    ctx.globalAlpha=0.45;
    const g=ctx.createRadialGradient(m.x,m.y,r*0.2, m.x,m.y,r);
    g.addColorStop(0,'#4a2c18');
    g.addColorStop(0.55,'#6b4326');
    g.addColorStop(1,'#3a2212');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(m.x,m.y,r,0,Math.PI*2); ctx.fill();
    // 포켓
    ctx.strokeStyle='rgba(0,0,0,0.5)';
    ctx.lineWidth=Math.max(1.5, r*0.10);
    ctx.beginPath(); ctx.arc(m.x,m.y,r*0.55,0,Math.PI*2); ctx.stroke();
    // 가죽 스티치
    ctx.strokeStyle='rgba(230,200,150,0.35)';
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(m.x,m.y,r*0.85,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // ── ABS 오버레이: 존 통과점 마커 + 셀 하이라이트 + 판정 배지 ──
  function drawABS(){
    if(!absCross) return;
    const col=absCross.strike ? '#52e07a' : '#ff5a5a';
    // 스트라이크면 통과한 9분할 셀을 하이라이트
    if(absCross.strike){
      const cw=ZONE_W/3, chh=(ZONE_TOP-ZONE_BOT)/3;
      const ci=Math.min(2,Math.max(0,Math.floor((absCross.X+ZONE_W/2)/cw)));
      const ri=Math.min(2,Math.max(0,Math.floor((ZONE_TOP-absCross.Y)/chh)));
      const x0=-ZONE_W/2+ci*cw, y1=ZONE_TOP-ri*chh, y0=y1-chh;
      const A=proj(x0,y1,0), B=proj(x0+cw,y1,0), C=proj(x0+cw,y0,0), D=proj(x0,y0,0);
      ctx.save();
      ctx.fillStyle='rgba(82,224,122,0.16)';
      ctx.beginPath();
      ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.lineTo(C.x,C.y); ctx.lineTo(D.x,D.y);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    // 통과 지점 마커 (존 앞면 기준, 공 실제 크기)
    const p=proj(absCross.X, absCross.Y, 0);
    const r=Math.max(4, BALL_R_M*p.s);
    ctx.save();
    ctx.strokeStyle=col;
    ctx.shadowColor=col; ctx.shadowBlur=10;
    ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.stroke();
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(p.x-r*1.7,p.y); ctx.lineTo(p.x-r*0.8,p.y);
    ctx.moveTo(p.x+r*0.8,p.y); ctx.lineTo(p.x+r*1.7,p.y);
    ctx.moveTo(p.x,p.y-r*1.7); ctx.lineTo(p.x,p.y-r*0.8);
    ctx.moveTo(p.x,p.y+r*0.8); ctx.lineTo(p.x,p.y+r*1.7);
    ctx.stroke();
    ctx.restore();
    drawABSBadge(col, absCross.strike);
  }
  function drawABSBadge(col, strike){
    const label=strike ? 'STRIKE' : 'BALL';
    const bw=132, bh=40, bx=W/2-bw/2, by=H-bh-12;
    ctx.save();
    ctx.fillStyle='rgba(8,13,24,0.88)';
    ctx.strokeStyle=col; ctx.lineWidth=1.5;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(bx,by,bw,bh,9); else ctx.rect(bx,by,bw,bh);
    ctx.fill(); ctx.stroke();
    ctx.textAlign='center';
    ctx.fillStyle='#8a93a3';
    ctx.font='700 10px -apple-system,sans-serif';
    ctx.fillText('ABS 자동 판정', W/2, by+15);
    ctx.fillStyle=col;
    ctx.font='800 16px -apple-system,sans-serif';
    ctx.fillText(label, W/2, by+33);
    ctx.restore();
  }

  function drawBatter(){
    // 우타자: 화면 왼쪽 타석(X<0), 좌타자: 화면 오른쪽 타석(X>0)
    const side = batLefty? 1 : -1;
    const bx = side*0.95;          // 타석을 존에서 더 옆으로 (궤적 안 가리게)
    const dpt = 1.2;               // 깊이를 키워 원근상 작게
    const foot = proj(bx, 0, dpt);
    const head = proj(bx, 1.7, dpt);
    const h = foot.y - head.y;
    const x = foot.x, y = foot.y;
    ctx.save();
    ctx.globalAlpha=0.55;          // 살짝 투명 — 배경으로 물러나게
    ctx.strokeStyle='rgba(255,120,120,0.85)';
    ctx.fillStyle='rgba(255,120,120,0.85)';
    ctx.lineWidth=Math.max(1.5, h*0.06);
    ctx.lineCap='round'; ctx.lineJoin='round';
    // 머리
    ctx.beginPath();
    ctx.arc(x, y-h*0.86, Math.max(2,h*0.10), 0, Math.PI*2);
    ctx.fill();
    // 몸통
    ctx.beginPath();
    ctx.moveTo(x, y-h*0.74); ctx.lineTo(x, y-h*0.34);
    ctx.stroke();
    // 다리
    ctx.beginPath();
    ctx.moveTo(x, y-h*0.34); ctx.lineTo(x-h*0.11, y);
    ctx.moveTo(x, y-h*0.34); ctx.lineTo(x+h*0.11, y);
    ctx.stroke();
    // 배트 — 바깥쪽(존 반대편)으로 짧게 세움 → 궤적 침범 안 함
    const bs=side;   // 바깥 방향
    const sx=x+bs*h*0.06, sy=y-h*0.66;
    ctx.beginPath();
    ctx.moveTo(x, y-h*0.6);
    ctx.lineTo(sx, sy);
    ctx.lineTo(sx+bs*h*0.22, sy-h*0.26);
    ctx.stroke();
    ctx.restore();
    // 타석 라벨 (작게)
    ctx.fillStyle='rgba(255,150,150,0.6)';
    ctx.font='600 10px -apple-system,sans-serif';
    ctx.textAlign='center';
    ctx.fillText(batLefty?'좌타석':'우타석', x, y+12);
  }

  function drawPitcher(t){
    const sgn=lefty?-1:1;
    const base=proj(0, MOUND_H, MOUND_DIST);
    const head=proj(0, MOUND_H+PITCHER_H, MOUND_DIST);
    const h=base.y-head.y;     // 화면상 키
    const x=base.x, y=base.y;
    const wind = throwT>0 ? Math.min(1, Math.max(0, 1-(throwT-t)/600)) : 0;
    ctx.save();
    ctx.strokeStyle='rgba(230,234,240,0.95)';
    ctx.fillStyle='rgba(230,234,240,0.95)';
    ctx.lineWidth=Math.max(2, h*0.09);
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.arc(x, y-h*0.86, Math.max(2.5,h*0.12), 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x, y-h*0.72); ctx.lineTo(x, y-h*0.3);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y-h*0.3); ctx.lineTo(x-h*0.18, y);
    ctx.moveTo(x, y-h*0.3); ctx.lineTo(x+h*0.16, y);
    ctx.stroke();
    const aA=-2.3+wind*2.6;
    ctx.beginPath();
    ctx.moveTo(x, y-h*0.62);
    ctx.lineTo(x+Math.cos(aA)*h*0.4*sgn*-1, y-h*0.62+Math.sin(aA)*h*0.4);
    ctx.stroke();
    ctx.restore();
  }

  // ───────── 옆에서 ─────────
  function drawSide(t){
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#08111f'); bg.addColorStop(1,'#050a12');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    const pad=12, titleH=35, gap=10;
    const panelH=(H-titleH-gap*2-22)/2;
    const top={x:pad,y:titleH,w:W-pad*2,h:panelH};
    const bot={x:pad,y:titleH+panelH+gap,w:W-pad*2,h:panelH};
    const panel=p=>{
      ctx.fillStyle='rgba(16,27,44,0.92)'; ctx.strokeStyle='rgba(92,118,158,0.45)'; ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.roundRect(p.x,p.y,p.w,p.h,12); ctx.fill(); ctx.stroke();
    };
    panel(top); panel(bot);

    const rel=releaseT(t);
    if(rel==='done'){
      pathDone=true; judgeABS();
    } else if(rel!==null){
      const w=ballWorld(Math.min(rel,1));
      if(!path.length || Math.abs(path[path.length-1].d-w.d)>0.002) pushPath(w);
    }

    const g=STUDY_GUIDES[cur.key]||{breakAt:0.55,short:'움직임'};
    ctx.fillStyle='#fff'; ctx.font='800 14px -apple-system,sans-serif'; ctx.textAlign='left';
    ctx.fillText('상하·좌우 움직임을 따로 본다',pad+2,22);

    const xL=top.x+42, xR=top.x+top.w-18;
    const xForD=d=>xL+(1-d/RELEASE_D)*(xR-xL);
    const yMin=0.30,yMax=2.02;
    const ySide=y=>top.y+top.h-20-(y-yMin)/(yMax-yMin)*(top.h-48);
    const centerY=bot.y+bot.h/2+8;
    const latRange=Math.max(0.68,Math.abs(cur.bx)+0.22,cmp?Math.abs(cmp.bx)+0.22:0);
    const yTop=x=>centerY+x/latRange*(bot.h*0.34);

    // 패널 제목과 기준선
    ctx.font='800 12px -apple-system,sans-serif'; ctx.textAlign='left';
    ctx.fillStyle='#a8c7ff'; ctx.fillText('옆에서 — 얼마나 떨어지는가',top.x+12,top.y+18);
    ctx.fillStyle='#ffca88'; ctx.fillText('위에서 — 어느 쪽으로 휘는가',bot.x+12,bot.y+18);
    ctx.font='600 10px -apple-system,sans-serif'; ctx.fillStyle='rgba(255,255,255,0.45)';
    ctx.textAlign='left'; ctx.fillText('투수',xL-8,top.y+top.h-6); ctx.textAlign='right'; ctx.fillText('포수',xR+8,top.y+top.h-6);

    ctx.strokeStyle='rgba(255,255,255,0.10)'; ctx.lineWidth=1;
    for(const hh of [0.5,1.0,1.5]){
      const yy=ySide(hh); ctx.beginPath(); ctx.moveTo(xL,yy); ctx.lineTo(xR,yy); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.font='10px -apple-system,sans-serif'; ctx.textAlign='right';
      ctx.fillText(hh.toFixed(1)+'m',xL-6,yy+3);
    }
    ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(xL,centerY); ctx.lineTo(xR,centerY); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,0.36)'; ctx.font='700 10px -apple-system,sans-serif';
    ctx.textAlign='left'; ctx.fillText(lefty?'팔쪽':'글러브쪽',bot.x+8,centerY-bot.h*0.23);
    ctx.fillText(lefty?'글러브쪽':'팔쪽',bot.x+8,centerY+bot.h*0.23);
    ctx.textAlign='center'; ctx.fillText('투수  →  포수',bot.x+bot.w/2,bot.y+35);

    function samplePath(p, useBase, mapper, color, alpha, dashed, width){
      ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineCap='round'; ctx.lineJoin='round';
      if(dashed) ctx.setLineDash([7,5]);
      ctx.beginPath();
      for(let i=0;i<=80;i++){
        const w=ballWorldFor(p,i/80,knSeed+(p===cur?0:11));
        const pt=mapper(useBase?{...w,X:w.X0,Y:w.Y0}:w);
        i?ctx.lineTo(pt.x,pt.y):ctx.moveTo(pt.x,pt.y);
      }
      ctx.stroke(); ctx.restore();
    }
    const mapSide=w=>({x:xForD(w.d),y:ySide(w.Y)});
    const mapTop=w=>({x:xForD(w.d),y:yTop(w.X)});

    // 학습 모드에서는 완성될 전체 궤적을 옅게 먼저 보여준다.
    if(mode==='study'){
      samplePath(cur,false,mapSide,cur.color,0.20,false,5);
      samplePath(cur,false,mapTop,cur.color,0.20,false,5);
    }
    // 회전이 없었다면 갈 기준선
    samplePath(cur,true,mapSide,'#ffffff',0.30,true,1.3);
    samplePath(cur,true,mapTop,'#ffffff',0.30,true,1.3);
    if(cmp && cmp.key!==cur.key){
      samplePath(cmp,false,mapSide,cmp.color,0.76,true,2.2);
      samplePath(cmp,false,mapTop,cmp.color,0.76,true,2.2);
    }

    function drawAnimated(mapper){
      if(path.length<2) return;
      ctx.save(); ctx.strokeStyle=cur.color; ctx.lineWidth=3.5; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath();
      path.forEach((w,i)=>{const p=mapper(w); i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);});
      ctx.stroke(); ctx.restore();
    }
    drawAnimated(mapSide); drawAnimated(mapTop);

    // 변화 시작 지점
    const bw=ballWorldFor(cur,g.breakAt,knSeed);
    [mapSide(bw),mapTop(bw)].forEach((p,idx)=>{
      ctx.strokeStyle=cur.color; ctx.lineWidth=1.8; ctx.globalAlpha=0.8;
      ctx.beginPath(); ctx.arc(p.x,p.y,5.5,0,Math.PI*2); ctx.stroke();
      if(idx===0){ctx.fillStyle='#fff';ctx.font='700 9px -apple-system,sans-serif';ctx.textAlign='center';ctx.fillText('변화 시작',p.x,p.y-9);}
    });
    ctx.globalAlpha=1;

    let current=null;
    if(rel==='done') current=ballWorldFor(cur,1,knSeed);
    else if(rel!==null) current=ballWorld(Math.min(rel,1));
    else if(pathDone) current=ballWorldFor(cur,1,knSeed);
    if(current){
      const a=mapSide(current), b=mapTop(current);
      drawBallSpin(a.x,a.y,Math.max(4,W*0.012),t);
      drawBallSpin(b.x,b.y,Math.max(4,W*0.012),t);
    }

    // 도착점과 핵심 수치
    const end=ballWorldFor(cur,1,knSeed);
    const e1=mapSide(end), e2=mapTop(end);
    const col=absCross?(absCross.strike?'#52e07a':'#ff5a5a'):cur.color;
    ctx.fillStyle=col; [e1,e2].forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();});
    ctx.fillStyle='rgba(5,9,17,0.84)'; ctx.strokeStyle='rgba(255,255,255,0.14)';
    const cardW=Math.min(W-36,360), cardX=(W-cardW)/2, cardY=bot.y+bot.h-38;
    ctx.beginPath(); ctx.roundRect(cardX,cardY,cardW,29,9); ctx.fill(); ctx.stroke();
    const T=flightT(cur);
    ctx.fillStyle='#fff'; ctx.font='700 10.5px -apple-system,sans-serif'; ctx.textAlign='center';
    ctx.fillText('도달 '+T.toFixed(2)+'초 · 좌우 '+Math.round(Math.abs(cur.bx)*100)+'cm · 상하 '+(cur.mv>=0?'+':'')+Math.round(cur.mv*100)+'cm',W/2,cardY+12);
    ctx.fillStyle=cur.color; ctx.fillText(g.short+' — '+g.cue,W/2,cardY+23);
  }

  function drawPitcherSide(mx, gy, mY, t){
    const wind = throwT>0 ? Math.min(1, Math.max(0, 1-(throwT-t)/600)) : 0;
    const h=mY(0)-mY(PITCHER_H);
    const y=gy, x=mx;
    ctx.save();
    ctx.strokeStyle='rgba(230,234,240,0.9)';
    ctx.fillStyle='rgba(230,234,240,0.9)';
    ctx.lineWidth=Math.max(2.5, h*0.07);
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.arc(x, y-h*0.86, h*0.10, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x, y-h*0.74); ctx.lineTo(x+h*0.04, y-h*0.32);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x+h*0.04, y-h*0.32); ctx.lineTo(x-h*0.15-wind*h*0.15, y);
    ctx.moveTo(x+h*0.04, y-h*0.32); ctx.lineTo(x+h*0.14, y);
    ctx.stroke();
    const aA=-2.4+wind*2.9;
    ctx.beginPath();
    ctx.moveTo(x, y-h*0.66);
    ctx.lineTo(x+Math.cos(aA)*h*0.34, y-h*0.66+Math.sin(aA)*h*0.34);
    ctx.stroke();
    ctx.restore();
  }

  // ───────── 그립 (정밀화) ─────────
  function drawGrip(){
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#0b172b'); bg.addColorStop(1,'#050a12');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    const cx=W*0.43, cy=H*0.40, R=Math.min(W*0.34,H*0.27);
    ctx.fillStyle='#fff'; ctx.font='800 15px -apple-system,sans-serif'; ctx.textAlign='left';
    ctx.fillText('그립 도식 — 손 모양보다 접촉 위치를 본다',16,25);
    ctx.fillStyle=cur.color; ctx.font='800 12px -apple-system,sans-serif'; ctx.textAlign='right';
    ctx.fillText(cur.name,W-16,25);

    // 공 본체
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.55)'; ctx.shadowBlur=20; ctx.shadowOffsetY=7;
    const ballG=ctx.createRadialGradient(cx-R*0.35,cy-R*0.38,R*0.08,cx,cy,R*1.05);
    ballG.addColorStop(0,'#fff'); ballG.addColorStop(0.72,'#f1eee5'); ballG.addColorStop(1,'#c9c1b2');
    ctx.fillStyle=ballG; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill(); ctx.restore();
    // 손가락 접촉점과 겹쳐도 읽히도록 실밥을 단순하고 선명한 도식으로 표시한다.
    ctx.save();
    ctx.beginPath(); ctx.arc(cx,cy,R*0.98,0,Math.PI*2); ctx.clip();
    ctx.translate(cx,cy); ctx.rotate(cur.seamRot||0);
    ctx.strokeStyle='#c83f52'; ctx.lineWidth=Math.max(3,R*0.035); ctx.lineCap='round';
    ctx.setLineDash([Math.max(4,R*0.055),Math.max(3,R*0.035)]);
    for(const side of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(side*R*0.48,-R*0.88);
      ctx.bezierCurveTo(side*R*0.12,-R*0.52,side*R*0.12,R*0.52,side*R*0.48,R*0.88);
      ctx.stroke();
    }
    ctx.setLineDash([]); ctx.restore();

    const type=cur.gripType||'fourseam';
    const labels = type==='circle' ? ['중지','약지','새끼'] : type==='knuckle' ? ['검지 손톱','중지 손톱','약지 손톱'] : ['검지','중지'];
    const strong = (cur.key==='cutter'||cur.key==='sinker'||cur.key==='2seam') ? 0 :
                   (type==='slider'||type==='curve') ? 1 : -1;

    function contactFinger(fp,i){
      const x=cx+fp[0]*R, y=cy+fp[1]*R;
      const spread=(fp[0])*R*0.35;
      const ex=x+spread, ey=cy-R*1.18;
      ctx.save(); ctx.lineCap='round';
      ctx.strokeStyle='rgba(118,166,230,0.30)'; ctx.lineWidth=R*0.22;
      ctx.beginPath(); ctx.moveTo(ex,ey); ctx.quadraticCurveTo((ex+x)/2,y-R*0.18,x,y); ctx.stroke();
      ctx.strokeStyle='rgba(225,238,255,0.86)'; ctx.lineWidth=R*0.15;
      ctx.beginPath(); ctx.moveTo(ex,ey); ctx.quadraticCurveTo((ex+x)/2,y-R*0.18,x,y); ctx.stroke();
      ctx.fillStyle=i===strong?'#ff6b6b':'#58d6ff';
      ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=10;
      if(type==='knuckle'){
        ctx.fillRect(x-R*0.055,y-R*0.045,R*0.11,R*0.09);
      } else {
        ctx.beginPath(); ctx.ellipse(x,y,R*0.115,R*0.07,fp[0]*0.7,0,Math.PI*2); ctx.fill();
      }
      ctx.shadowBlur=0; ctx.fillStyle='#17304b'; ctx.font='900 9.5px -apple-system,sans-serif'; ctx.textAlign='center';
      ctx.fillText(labels[i]||('손가락 '+(i+1)),ex,ey+17);
      if(i===strong){ctx.fillStyle='#ff6b6b';ctx.font='800 8.5px -apple-system,sans-serif';ctx.fillText('주 압력',ex,ey+29);}
      ctx.restore();
    }
    (cur.fingers||[]).forEach(contactFinger);

    if(type==='circle'){
      const rx=cx-R*1.06, ry=cy+R*0.16;
      ctx.save(); ctx.strokeStyle='#ffd05b'; ctx.lineWidth=R*0.10; ctx.shadowColor='#ffd05b';ctx.shadowBlur=8;
      ctx.beginPath();ctx.arc(rx,ry,R*0.23,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
      ctx.fillStyle='#fff';ctx.font='800 10px -apple-system,sans-serif';ctx.textAlign='center';
      ctx.fillText('엄지+검지',rx,ry-R*0.32);ctx.fillText('○ 만들기',rx,ry+R*0.38);ctx.restore();
    }
    if(type==='split'){
      ctx.save();ctx.strokeStyle='#ffd05b';ctx.lineWidth=2;ctx.setLineDash([5,4]);
      ctx.beginPath();ctx.arc(cx,cy-R*0.18,R*0.58,Math.PI*0.80,Math.PI*0.20,true);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='#ffd05b';ctx.font='800 10px -apple-system,sans-serif';ctx.textAlign='center';ctx.fillText('V자로 넓게 벌림',cx,cy-R*0.82);ctx.restore();
    }

    // 엄지는 뒷면에 있어 별도 작은 공으로 분리한다.
    const ix=W*0.79, iy=H*0.42, ir=Math.min(R*0.48,W*0.13);
    ctx.fillStyle='rgba(255,255,255,0.10)';ctx.strokeStyle='rgba(255,255,255,0.30)';ctx.lineWidth=1.3;
    ctx.beginPath();ctx.arc(ix,iy,ir,0,Math.PI*2);ctx.fill();ctx.stroke();
    const th=cur.thumb||[0,0.6];
    const tx=ix+th[0]*ir, ty=iy+th[1]*ir*0.75;
    ctx.fillStyle='#ffd05b';ctx.shadowColor='#ffd05b';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(tx,ty,Math.max(4,ir*0.11),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.font='800 11px -apple-system,sans-serif';ctx.textAlign='center';ctx.fillText('공 뒷면',ix,iy-ir-12);ctx.fillText('엄지',tx,ty+18);

    // 핵심 원칙 카드
    const cardX=14, cardY=H*0.68, cardW=W-28, cardH=H-cardY-14;
    ctx.fillStyle='rgba(10,18,31,0.92)';ctx.strokeStyle='rgba(85,113,155,0.48)';ctx.lineWidth=1.3;
    ctx.beginPath();ctx.roundRect(cardX,cardY,cardW,cardH,12);ctx.fill();ctx.stroke();
    ctx.fillStyle=cur.color;ctx.font='800 12px -apple-system,sans-serif';ctx.textAlign='left';ctx.fillText('잡는 법의 핵심',cardX+12,cardY+20);
    ctx.fillStyle='#d8dfeb';ctx.font='13px -apple-system,sans-serif';ctx.textAlign='left';
    wrapText(cur.gripTxt||'',cardX+12,cardY+41,cardW-24,18);
    ctx.fillStyle='rgba(255,255,255,0.50)';ctx.font='700 10px -apple-system,sans-serif';
    ctx.fillText('● 파랑: 접촉점   ● 빨강: 더 강하게 누르는 손가락   ● 노랑: 엄지/특수 동작',cardX+12,cardY+cardH-12);
  }

  // 그립 타입별 실밥
  function drawSeams(cx,cy,R,type){
    ctx.save();
    ctx.translate(cx,cy);
    ctx.strokeStyle='#c33c4e';
    ctx.lineCap='round';
    // 회전: 포심/스플리터는 가로 실밥(말굽이 위아래), 투심/싱커는 세로 실밥
    let rot=cur.seamRot;
    ctx.rotate(rot);
    const seam=(R0,a0,a1,cxx)=>{
      ctx.lineWidth=Math.max(3,R*0.05);
      ctx.beginPath();
      ctx.arc(cxx,0,R0,a0,a1);
      ctx.stroke();
      // 바늘땀
      ctx.lineWidth=Math.max(1.5,R*0.022);
      const steps=11;
      for(let i=0;i<=steps;i++){
        const a=a0+(a1-a0)*i/steps;
        const ax=cxx+Math.cos(a)*R0, ay=Math.sin(a)*R0;
        const nx=Math.cos(a), ny=Math.sin(a);
        ctx.beginPath();
        ctx.moveTo(ax-ny*R*0.07-nx*R*0.02, ay+nx*R*0.07-ny*R*0.02);
        ctx.lineTo(ax+ny*R*0.07+nx*R*0.02, ay-nx*R*0.07+ny*R*0.02);
        ctx.stroke();
      }
    };
    // 말굽 두 줄 (좌우 대칭)
    seam(R*1.5,  Math.PI-0.62, Math.PI+0.62, -R*1.25);
    seam(R*1.5, -0.62, 0.62, R*1.25);
    ctx.restore();
  }

  // ── 그립 손 렌더링: 실제 그립 사진 구도를 그대로 옮김 ──
  // 사진에서 보이는 것: 공이 카메라를 보고, 검지·중지 끝마디가 실밥을 짚고,
  // 손가락 몸통이 공 위 테두리를 넘어 손등(너클)으로 이어지며, 엄지가 아래를 받친다.
  function drawFingers(cx,cy,R,type){
    const SKIN      ='rgba(226,190,162,0.97)';
    const SKIN_DK   ='rgba(146,98,76,0.92)';
    const SKIN_HI   ='rgba(246,222,202,0.55)';
    const CREASE    ='rgba(150,105,85,0.5)';

    // 손등·너클 중심 (손가락들이 여기로 모임)
    const hb={x:cx, y:cy-R*1.18, w:R*1.42};

    // 위로 뻗는 손가락: 공 위 접점(tip) → 관절 → 손등 속으로
    function fingerUp(tipX,tipY,ang,wide,label,pressure){
      const tx=cx+tipX*R, ty=cy+tipY*R;
      // 접촉 그림자 — 손가락이 공을 '누르고 있음'
      ctx.save();
      ctx.globalAlpha=0.22;
      ctx.fillStyle='#503020';
      ctx.beginPath();
      ctx.ellipse(tx, ty+R*0.05, R*0.13, R*0.075, ang*0.5, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
      // 손가락 몸통: 끝(가늘게) → 너클(굵게), 사진처럼 위로 뻗어 손등에 합류
      const kx=hb.x + tipX*R*0.60 + Math.sin(ang)*R*0.18;
      const ky=hb.y + R*0.14;
      const jx=tx+(kx-tx)*0.46 + Math.sin(ang)*R*0.10;
      const jy=ty+(ky-ty)*0.46;
      ctx.save();
      ctx.lineCap='round';
      // 외곽
      ctx.strokeStyle=SKIN_DK;
      ctx.lineWidth=R*wide*1.08;
      ctx.beginPath(); ctx.moveTo(tx,ty); ctx.quadraticCurveTo((tx+jx)/2,(ty+jy)/2, jx,jy); ctx.stroke();
      ctx.lineWidth=R*wide*1.34;
      ctx.beginPath(); ctx.moveTo(jx,jy); ctx.quadraticCurveTo((jx+kx)/2,(jy+ky)/2, kx,ky); ctx.stroke();
      // 살
      ctx.strokeStyle=SKIN;
      ctx.lineWidth=R*wide*0.92;
      ctx.beginPath(); ctx.moveTo(tx,ty); ctx.quadraticCurveTo((tx+jx)/2,(ty+jy)/2, jx,jy); ctx.stroke();
      ctx.lineWidth=R*wide*1.18;
      ctx.beginPath(); ctx.moveTo(jx,jy); ctx.quadraticCurveTo((jx+kx)/2,(jy+ky)/2, kx,ky); ctx.stroke();
      // 윗면 하이라이트
      ctx.strokeStyle=SKIN_HI;
      ctx.lineWidth=R*wide*0.32;
      ctx.beginPath();
      ctx.moveTo(tx-R*wide*0.16, ty-R*0.02);
      ctx.quadraticCurveTo(jx-R*wide*0.2, jy, kx-R*wide*0.22, ky);
      ctx.stroke();
      // 관절 주름 2개
      ctx.strokeStyle=CREASE;
      ctx.lineWidth=1.2;
      const pang=Math.atan2(ky-ty,kx-tx)+Math.PI/2;
      for(const f of [0.46,0.72]){
        const mx2=tx+(kx-tx)*f, my2=ty+(ky-ty)*f;
        ctx.beginPath();
        ctx.moveTo(mx2+Math.cos(pang)*R*wide*0.42, my2+Math.sin(pang)*R*wide*0.42);
        ctx.lineTo(mx2-Math.cos(pang)*R*wide*0.42, my2-Math.sin(pang)*R*wide*0.42);
        ctx.stroke();
      }
      // 손톱 (끝마디 — 사진에서 보이는 그 각도)
      ctx.fillStyle='rgba(248,232,220,0.95)';
      ctx.strokeStyle='rgba(190,150,130,0.6)';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.ellipse(tx, ty-R*0.015, R*0.062, R*0.082, ang*0.5, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
      // 압력 강조
      if(pressure>1){
        ctx.strokeStyle='rgba(255,110,110,0.8)';
        ctx.shadowColor='#ff6a6a'; ctx.shadowBlur=10;
        ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(tx,ty,R*0.145,0,Math.PI*2); ctx.stroke();
      }
      ctx.restore();
      if(label){
        ctx.fillStyle='rgba(255,255,255,0.9)';
        ctx.font='700 11px -apple-system,sans-serif';
        ctx.textAlign='center';
        ctx.fillText(label, tx, ty+R*0.30);
      }
    }

    // 공 옆을 감아 받치는 접힌 약지·새끼 (아래로 말림)
    function foldFinger(tipX,tipY,len,ang,wide){
      const tx=cx+tipX*R, ty=cy+tipY*R;
      const dx=Math.sin(ang), dy=Math.cos(ang);
      const jx=tx+dx*len*R*0.45, jy=ty+dy*len*R*0.45;
      const bx=tx+dx*len*R,      by=ty+dy*len*R;
      ctx.save();
      ctx.lineCap='round';
      ctx.strokeStyle=SKIN_DK;
      ctx.lineWidth=R*wide*1.3;
      ctx.beginPath(); ctx.moveTo(bx,by); ctx.quadraticCurveTo(jx,jy, tx,ty); ctx.stroke();
      ctx.strokeStyle=SKIN;
      ctx.lineWidth=R*wide*1.06;
      ctx.beginPath(); ctx.moveTo(bx,by); ctx.quadraticCurveTo(jx,jy, tx,ty); ctx.stroke();
      // 손톱
      ctx.fillStyle='rgba(248,232,220,0.9)';
      ctx.beginPath();
      ctx.ellipse(tx,ty,R*0.055,R*0.07,ang,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    // 손등 + 너클 — 손가락 위끝을 덮어 '손에서 나온' 형태로 만드는 층
    function handBack(offX, width, yOff){
      const hx=hb.x+offX*R, hy=hb.y+(yOff||0)*R, hw=width*R;
      ctx.save();
      // 손목
      const wg=ctx.createLinearGradient(hx,hy-R*0.8,hx,hy);
      wg.addColorStop(0,'rgba(206,166,138,0.9)');
      wg.addColorStop(1,'rgba(222,184,156,0.98)');
      ctx.fillStyle=wg;
      ctx.beginPath();
      ctx.moveTo(hx-hw*0.34, hy-R*0.85);
      ctx.quadraticCurveTo(hx-hw*0.42, hy-R*0.3, hx-hw*0.46, hy+R*0.05);
      ctx.lineTo(hx+hw*0.46, hy+R*0.05);
      ctx.quadraticCurveTo(hx+hw*0.42, hy-R*0.3, hx+hw*0.34, hy-R*0.85);
      ctx.closePath(); ctx.fill();
      // 손등 본체
      const g=ctx.createLinearGradient(hx,hy-R*0.35,hx,hy+R*0.35);
      g.addColorStop(0,'rgba(232,198,170,0.99)');
      g.addColorStop(1,'rgba(210,168,138,0.99)');
      ctx.fillStyle=g;
      ctx.strokeStyle='rgba(146,98,76,0.7)';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(hx-hw*0.5, hy-R*0.18);
      ctx.quadraticCurveTo(hx-hw*0.55, hy+R*0.22, hx-hw*0.34, hy+R*0.30);
      // 너클 4개 볼록볼록한 아랫선
      for(let i=0;i<4;i++){
        const x1=hx-hw*0.34+hw*0.68*(i+0.5)/4;
        const x2=hx-hw*0.34+hw*0.68*(i+1)/4;
        ctx.quadraticCurveTo(x1, hy+R*0.42, x2, hy+R*0.30);
      }
      ctx.quadraticCurveTo(hx+hw*0.55, hy+R*0.22, hx+hw*0.5, hy-R*0.18);
      ctx.quadraticCurveTo(hx, hy-R*0.42, hx-hw*0.5, hy-R*0.18);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      // 너클 음영 점
      ctx.fillStyle='rgba(150,105,85,0.35)';
      for(let i=0;i<4;i++){
        const kx2=hx-hw*0.34+hw*0.68*(i+0.5)/4;
        ctx.beginPath(); ctx.ellipse(kx2, hy+R*0.27, R*0.05, R*0.035, 0, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }

    // 엄지: 아래에서 받치는 굽은 형태 + 손바닥 언덕
    function thumb(tipX,tipY){
      const tx=cx+tipX*R, ty=cy+tipY*R;
      ctx.save();
      ctx.fillStyle='rgba(214,174,146,0.40)';
      ctx.beginPath();
      ctx.ellipse(tx+R*0.15, ty+R*1.02, R*0.52, R*0.32, 0.1, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle='rgba(222,184,156,0.60)';
      ctx.beginPath();
      ctx.ellipse(tx-R*0.02, ty+R*0.56, R*0.72, R*0.38, -0.22, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle='rgba(150,105,85,0.30)';
      ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(tx-R*0.35, ty+R*0.42);
      ctx.quadraticCurveTo(tx+R*0.05, ty+R*0.62, tx+R*0.42, ty+R*0.52);
      ctx.stroke();
      ctx.globalAlpha=0.2;
      ctx.fillStyle='#503020';
      ctx.beginPath();
      ctx.ellipse(tx, ty-R*0.03, R*0.12, R*0.07, 0.3, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha=1;
      ctx.lineCap='round';
      const j1x=tx-R*0.14, j1y=ty+R*0.24;
      ctx.strokeStyle='rgba(146,98,76,0.9)';
      ctx.lineWidth=R*0.33;
      ctx.beginPath(); ctx.moveTo(tx-R*0.38, ty+R*0.55); ctx.quadraticCurveTo(tx-R*0.3,ty+R*0.38, j1x,j1y); ctx.stroke();
      ctx.lineWidth=R*0.29;
      ctx.beginPath(); ctx.moveTo(j1x,j1y); ctx.quadraticCurveTo(tx-R*0.05,ty+R*0.08, tx,ty); ctx.stroke();
      ctx.strokeStyle='rgba(226,190,162,0.92)';
      ctx.lineWidth=R*0.28;
      ctx.beginPath(); ctx.moveTo(tx-R*0.38, ty+R*0.55); ctx.quadraticCurveTo(tx-R*0.3,ty+R*0.38, j1x,j1y); ctx.stroke();
      ctx.lineWidth=R*0.24;
      ctx.beginPath(); ctx.moveTo(j1x,j1y); ctx.quadraticCurveTo(tx-R*0.05,ty+R*0.08, tx,ty); ctx.stroke();
      ctx.strokeStyle='rgba(245,220,200,0.5)';
      ctx.lineWidth=R*0.08;
      ctx.beginPath(); ctx.moveTo(tx-R*0.34,ty+R*0.48); ctx.quadraticCurveTo(j1x,j1y-R*0.05, tx-R*0.02,ty+R*0.02); ctx.stroke();
      ctx.fillStyle='rgba(248,232,220,0.95)';
      ctx.strokeStyle='rgba(190,150,130,0.6)';
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.ellipse(tx,ty,R*0.07,R*0.05,0.5,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.restore();
      ctx.fillStyle='rgba(255,255,255,0.6)';
      ctx.font='600 10px -apple-system,sans-serif';
      ctx.textAlign='center';
      ctx.fillText('엄지', tx-R*0.25, ty+R*0.34);
    }

    switch(type){
      case 'fourseam': // 검지·중지 모아 가로 실밥 위
        fingerUp(-0.17,-0.42,-0.10,0.20,'검지',1);
        fingerUp( 0.17,-0.42, 0.10,0.20,'중지',1);
        foldFinger(0.72,0.36,0.55, 0.55,0.15);
        foldFinger(0.84,0.58,0.45, 0.85,0.13);
        handBack(0,1.42,0);
        thumb(0,0.62); break;
      case 'twoseam': // 좁게 모아 세로 실밥
        fingerUp(-0.10,-0.44,-0.04,0.19,'검지',1.3);
        fingerUp( 0.10,-0.44, 0.04,0.19,'중지',1);
        foldFinger(0.72,0.36,0.55, 0.55,0.15);
        foldFinger(0.84,0.58,0.45, 0.85,0.13);
        handBack(0,1.36,0);
        thumb(0,0.62); break;
      case 'cutter': // 살짝 글러브쪽으로
        fingerUp(-0.02,-0.44,-0.06,0.19,'검지',1.4);
        fingerUp( 0.22,-0.40, 0.14,0.19,'중지',1);
        foldFinger(0.74,0.34,0.55, 0.55,0.15);
        foldFinger(0.85,0.56,0.45, 0.85,0.13);
        handBack(0.10,1.40,0);
        thumb(-0.1,0.6); break;
      case 'slider': // 바깥 절반, 중지 실밥에 걸기
        fingerUp( 0.06,-0.43, 0.04,0.19,'검지',1);
        fingerUp( 0.30,-0.36, 0.22,0.19,'중지',1.4);
        foldFinger(0.78,0.32,0.5, 0.6,0.15);
        foldFinger(0.87,0.54,0.42, 0.9,0.13);
        handBack(0.18,1.40,0);
        thumb(-0.16,0.58); break;
      case 'curve': // 바짝 모으고 중지 깊게
        fingerUp(-0.06,-0.44,-0.08,0.18,'검지',1);
        fingerUp( 0.14,-0.43, 0.02,0.18,'중지',1.5);
        foldFinger(0.72,0.36,0.55, 0.55,0.15);
        foldFinger(0.84,0.58,0.45, 0.85,0.13);
        handBack(0.04,1.38,0);
        thumb(0.02,0.6); break;
      case 'circle': // 서클 체인지업 — 엄지+검지 동그라미, 나머지 세 손가락이 공 위
        ctx.save();
        ctx.strokeStyle='rgba(228,196,170,0.95)';
        ctx.lineWidth=R*0.13;
        ctx.beginPath();
        ctx.arc(cx-R*0.42, cy+R*0.12, R*0.26, 0, Math.PI*2);
        ctx.stroke();
        ctx.restore();
        ctx.fillStyle='rgba(255,255,255,0.8)';
        ctx.font='700 11px -apple-system,sans-serif';
        ctx.textAlign='center';
        ctx.fillText('○ 서클', cx-R*0.42, cy-R*0.22);
        fingerUp( 0.02,-0.44, 0.00,0.18,'중지',1);
        fingerUp( 0.26,-0.38, 0.18,0.17,'약지',1);
        foldFinger(0.82,0.52,0.45, 0.85,0.13);
        handBack(0.14,1.36,0);
        thumb(-0.05,0.6); break;
      case 'split': // V자로 쫙 벌림
        fingerUp(-0.42,-0.28,-0.40,0.19,'검지',1);
        fingerUp( 0.42,-0.28, 0.40,0.19,'중지',1);
        foldFinger(0.60,0.52,0.5, 0.7,0.14);
        foldFinger(0.76,0.70,0.42, 0.95,0.12);
        handBack(0,1.85,0.06);
        thumb(0,0.62);
        ctx.save();
        ctx.strokeStyle='rgba(120,170,255,0.4)';
        ctx.lineWidth=2; ctx.setLineDash([4,4]);
        ctx.beginPath();
        ctx.arc(cx,cy-R*0.3,R*0.5,Math.PI*0.78,Math.PI*0.22,true);
        ctx.stroke(); ctx.setLineDash([]);
        ctx.restore(); break;
      case 'knuckle': // 손톱 세우기 — 주먹 쥔 손이 공 위를 덮음
        handBack(0,1.5,0.55);
        for(const fx of [-0.2,0,0.2]){
          const tx=cx+fx*R, ty=cy-R*0.46;
          ctx.save();
          ctx.fillStyle='rgba(228,196,170,0.95)';
          ctx.strokeStyle='rgba(150,110,90,0.6)';
          ctx.lineWidth=1.2;
          // 접힌 끝마디 (세운 손톱)
          ctx.beginPath();
          ctx.rect(tx-R*0.055,ty-R*0.02,R*0.11,R*0.20);
          ctx.fill(); ctx.stroke();
          ctx.fillStyle='rgba(248,232,220,0.95)';
          ctx.beginPath();
          ctx.ellipse(tx,ty+R*0.02,R*0.045,R*0.055,0,0,Math.PI*2);
          ctx.fill();
          ctx.shadowColor='#ff6a6a'; ctx.shadowBlur=8;
          ctx.fillStyle='#ff8a8a';
          ctx.beginPath(); ctx.arc(tx,ty,R*0.05,0,Math.PI*2); ctx.fill();
          ctx.restore();
        }
        ctx.fillStyle='rgba(255,255,255,0.8)';
        ctx.font='700 11px -apple-system,sans-serif';
        ctx.textAlign='center';
        ctx.fillText('손톱을 세워 박기', cx, cy-R*0.72);
        foldFinger(0.80,0.42,0.45, 0.8,0.14);
        thumb(0,0.62); break;
      default:
        fingerUp(-0.17,-0.42,-0.10,0.20,'검지',1);
        fingerUp( 0.17,-0.42, 0.10,0.20,'중지',1);
        handBack(0,1.42,0);
        thumb(0,0.62);
    }
  }

  // 캔버스 텍스트 줄바꿈
  function wrapText(text,x,y,maxW,lh){
    const chars=text.split('');
    let line='', yy=y;
    for(let i=0;i<chars.length;i++){
      const test=line+chars[i];
      if(ctx.measureText(test).width>maxW && line){
        ctx.fillText(line,x,yy);
        line=chars[i]; yy+=lh;
      } else line=test;
    }
    if(line) ctx.fillText(line,x,yy);
  }

  // ───────── 공 + 회전 ─────────
  function shade(hex,f){
    const n=parseInt(hex.slice(1),16);
    return 'rgb('+Math.floor(((n>>16)&255)*f)+','+Math.floor(((n>>8)&255)*f)+','+Math.floor((n&255)*f)+')';
  }
  // 야구공 실밥 3D 곡선 (단위 구면 위) — 미리 계산
  const SEAM_PTS=(()=>{
    const a=0.72,b=0.28,c=2*Math.sqrt(a*b),pts=[];
    for(let i=0;i<=160;i++){
      const tt=i/160*Math.PI*2;
      pts.push([a*Math.cos(tt)+b*Math.cos(3*tt), a*Math.sin(tt)-b*Math.sin(3*tt), c*Math.sin(2*tt)]);
    }
    return pts;
  })();

  function drawBallSpin(x,y,r,t){
    ctx.save();
    ctx.translate(x,y);
    // 구종 색 글로우 (공 식별용 유지)
    ctx.shadowColor=cur.color;
    ctx.shadowBlur=Math.min(16, r*1.2);
    // 공 본체 — 흰 야구공 셰이딩
    const bg=ctx.createRadialGradient(-r*0.35,-r*0.35,r*0.1, 0,0,r);
    bg.addColorStop(0,'#ffffff');
    bg.addColorStop(0.55,'#f2eee4');
    bg.addColorStop(1,'#b6ae9d');
    ctx.beginPath();
    ctx.arc(0,0,r,0,Math.PI*2);
    ctx.fillStyle=bg;
    ctx.fill();
    ctx.shadowBlur=0;
    // 구종 색 테두리 링
    if(r>3){
      ctx.strokeStyle=cur.color;
      ctx.globalAlpha=0.55;
      ctx.lineWidth=Math.max(1, r*0.09);
      ctx.beginPath(); ctx.arc(0,0,r*0.98,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=1;
    }
    if(r>4 && cur.spin!=='none'){
      // 구종별 회전축 — back:백스핀, top/down:탑스핀 계열, side:자이로(총알)
      let ang=t*cur.spinSpd*0.05, axis;
      if(cur.spin==='side'){ axis=[0.22,0.18,0.96]; }        // 시선축 회전 → 중심 빨간점이 자연히 생김
      else if(cur.spin==='top'){ axis=[1,0,0]; ang=-ang; }
      else if(cur.spin==='down'){ axis=[0.9,0,0.35]; ang=-ang*1.2; }
      else { axis=[1,0,0]; }                                  // back
      const al=Math.hypot(axis[0],axis[1],axis[2]);
      const ux=axis[0]/al, uy=axis[1]/al, uz=axis[2]/al;
      const ca=Math.cos(ang), sa=Math.sin(ang), ic=1-ca;
      const m00=ca+ux*ux*ic,    m01=ux*uy*ic-uz*sa, m02=ux*uz*ic+uy*sa;
      const m10=uy*ux*ic+uz*sa, m11=ca+uy*uy*ic,    m12=uy*uz*ic-ux*sa;
      const m20=uz*ux*ic-uy*sa, m21=uz*uy*ic+ux*sa, m22=ca+uz*uz*ic;
      // 실밥: 앞면(z>0)만, 깊이에 따라 진하고 굵게 → 진짜 구가 도는 느낌
      ctx.lineCap='round';
      let prev=null;
      for(let i=0;i<SEAM_PTS.length;i++){
        const p=SEAM_PTS[i];
        const X=m00*p[0]+m01*p[1]+m02*p[2];
        const Y=m10*p[0]+m11*p[1]+m12*p[2];
        const Z=m20*p[0]+m21*p[1]+m22*p[2];
        const q={x:X*r*0.99, y:Y*r*0.99, z:Z};
        if(prev && prev.z>0.03 && q.z>0.03){
          const depth=(prev.z+q.z)/2;
          ctx.strokeStyle='rgba(195,60,78,'+(0.3+0.65*depth).toFixed(2)+')';
          ctx.lineWidth=Math.max(1, r*0.085*(0.45+0.65*depth));
          ctx.beginPath();
          ctx.moveTo(prev.x,prev.y);
          ctx.lineTo(q.x,q.y);
          ctx.stroke();
        }
        prev=q;
      }
    }
    ctx.restore();
  }

  function loop(){
    const t=performance.now();
    if(view==='front') drawFront(t);
    else if(view==='side') drawSide(t);
    else drawGrip();
    requestAnimationFrame(loop);
  }

  resize();
  updateInfo();
  updateMatchup();
  doThrow('study');
  loop();
})();
</script>
</body>
