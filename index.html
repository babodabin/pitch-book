  const RESULT_TXT={
    ball:['볼',''], called:['스트라이크','루킹'], whiff:['스트라이크','헛스윙'], foul:['파울',''],
    out:['아웃','인플레이'], single:['안타','단타'], double:['2루타','장타'], hr:['홈런','담장 밖'],
    walk:['볼넷',''], strikeout:['삼진','']
  };
  const RESULT_COL={
    ball:'#ff5a5a', called:'#52e07a', whiff:'#52e07a', foul:'#ffd23b',
    out:'#52e07a', single:'#ff9a3d', double:'#ff5a5a', hr:'#ff5a5a', walk:'#ff5a5a', strikeout:'#52e07a'
  };

  let dexCur=cur;            // 도감에서 보고 있던 구종 (게임 나가면 복구)
  let gamePitch='FF';        // 고른 구종 코드
  let gameAim=null;          // 노린 점 {x,z} (미트 위치)
  const game={ phase:'idle', g:null, inning:null, batterIdx:0, pa:null, rec:null, endTimer:0, aimZone:null,
    scout:[],        // 이 이닝에 던진 공 (타자 AI 기억)
    t0:0,            // 던진 시각 (throwT 복사본 — 얼어붙여도 스윙 타이밍은 이걸로)
    entry:null,      // 앞면(투수 쪽, d=0.43) 통과점 {X,Y}
    entered:false,   // 앞면을 지났나
    contacted:false, // 배트에 맞았나 (파울·인플레이)
    hit:null,        // 맞은 공 날아가기 {t0, x,z,d, vx,vz,vd}
    swingEnd:false };
  const PLATE_D=0.43;  // 존 상자 깊이 = 앞면(투수 쪽)까지의 거리

  // ── 게임 구종 칩 ──
  const gbar=$('game-bar');
  const gchips={};
  GAME_PITCHES.forEach(([code,p])=>{
    const c=document.createElement('div');
    c.className='p-chip';
    c.style.setProperty('--c', p.color);
    c.textContent=p.name.split(' ')[0];
    c.addEventListener('click', ()=>{
      gamePitch=code;
      Object.values(gchips).forEach(x=>x.classList.remove('on'));
      c.classList.add('on');
      if(game.phase!=='flying'){ cur=p; updateInfo(); }
    });
    gbar.appendChild(c); gchips[code]=c;
  });
  gchips.FF.classList.add('on');

  // ABS 판정 (도감과 같은 규칙: 공 일부라도 존에 걸치면 스트라이크)
  function absJudge(x,z){
    const R=BALL_R_M;
    return Math.abs(x)<=ZONE_W/2+R && z>=ZONE_BOT-R && z<=ZONE_TOP+R;
  }

  function batHand(i){ return E.batSide(LINEUP[i%9].hand, lefty?'L':'R'); }
  function curHands(){ return (lefty?'L':'R') + batHand(game.batterIdx); }

  function enterGame(){
    if(view!=='game') return;
    dexCur=cur;
    mode='real';
    throwT=-1; path=[]; pathDone=false; absCross=null; trail=[];
    if(!TABLE){ showMsg('확률표가 없습니다', 'tools/build.js 를 돌려주세요', '#ff5a5a'); return; }
    if(!game.inning){ applySetup(); showSetup(); }
    else {
      cur=GAME_PITCH_MAP[gamePitch]; updateInfo(); updateHUD();
      if(game.phase==='over') showEnd();
      else if($('game-msg').innerHTML) $('game-msg').style.display='block';
    }
  }
  function leaveGame(){
    if(game.phase==='flying'){ game.entered=true; game.contacted=false; game.hit=null; onArrive(); }  // 날아가던 공은 결과만 반영
    gameAim=null; game.aimZone=null; $('throw-btn').disabled=true;
    cur=dexCur; updateInfo();
    $('game-msg').style.display='none';
    $('game-end').style.display='none';
    $('game-setup').style.display='none';
  }

  function newGame(){
    game.g=E.startGame();
    game.inning=game.g.inn;
    game.scout=[];
    game.batterIdx=0;
    game.aimZone=null;
    $('throw-btn').disabled=true;
    game.pa=E.startPA(curHands());
    game.rec=null; game.hit=null; game.entry=null; game.contacted=false; game.entered=false;
    game.phase='ready';
    gameAim=null;
    throwT=-1; path=[]; pathDone=false; absCross=null;
    batLefty = batHand(0)==='L';
    updateMatchup();
    cur=GAME_PITCH_MAP[gamePitch]; updateInfo();
    $('game-end').style.display='none';
    const mp=myPitcher();
    showMsg('구종을 고르고 존을 누른 뒤, 투구', '상대 '+teamOf(setup.opp).name+' · 당신은 '+mp.name+' ('+(mp.hand==='L'?'좌투':'우투')+') · 9회말 3:2 1사 1·2루', '#aab2c0');
    updateHUD();
  }

  function showMsg(main, sub, col){
    const m=$('game-msg');
    m.innerHTML=main+(sub?'<small>'+sub+'</small>':'');
    m.style.borderColor=col||'#3a4660';
    m.style.color=col||'#fff';
    m.style.display='block';
  }

  function updateHUD(){
    const inn=game.inning, pa=game.pa;
    if(!inn) return;
    document.querySelector('#game-hud .gh-inn').textContent=inn.inning+'회말';
    document.querySelector('#game-hud .gh-score').textContent=game.g.us+' : '+(game.g.them+inn.runs);
    const b=document.querySelectorAll('#game-hud .gh-bases i');
    b[0].classList.toggle('on', inn.bases[1]);   // b2
    b[1].classList.toggle('on', inn.bases[0]);   // b1
    b[2].classList.toggle('on', inn.bases[2]);   // b3
    document.querySelector('#game-hud .gh-outs').textContent=inn.outs+'아웃';
    let h='B ';
    for(let i=0;i<3;i++) h+='<b class="b'+(i<pa.balls?' on':'')+'"></b>';
    h+='&nbsp; S ';
    for(let i=0;i<2;i++) h+='<b class="s'+(i<pa.strikes?' on':'')+'"></b>';
    document.querySelector('#game-hud .gh-count').innerHTML=h;
    const bt=LINEUP[game.batterIdx%9];
    document.querySelector('#game-hud .gh-bat').textContent=(game.batterIdx%9+1)+'번 '+bt.name+' · '+(batHand(game.batterIdx)==='L'?'좌타':'우타')+(bt.hand==='S'?'(스위치)':'')+' · '+E.BATTER_TYPES[bt.type].ko+' · '+pa.history.length+'구';
  }

  // 화면 탭 → 존 칸
  function tapToZone(px,py){
    const S=W*ZOOM()/ZONE_W;          // proj() 의 d=0 배율
    const HOR=H*0.34;
    const X=(px-W/2)/S, Y=EYE_H-(py-HOR)/S;
    const g=E.ZONE_GEOM, m=0.32;      // 존 밖 여유
    if(Math.abs(X)>g.halfW+m || Y<g.bot-m || Y>g.top+m) return null;
    return E.pointToZone(X,Y);
  }

  cv.addEventListener('click', ev=>{
    if(view==='front'){
      const r=cv.getBoundingClientRect();
      const zone=tapToZone(ev.clientX-r.left, ev.clientY-r.top);
      if(!zone) return;
      const t=E.zoneTarget(zone);
      dexAim={x:t.x, z:t.z};
      doThrow(mode);
      return;
    }
    if(view!=='game' || game.phase!=='ready') return;
    const r=cv.getBoundingClientRect();
    const zone=tapToZone(ev.clientX-r.left, ev.clientY-r.top);
    if(!zone) return;
    game.aimZone=zone;
    const aim=E.zoneTarget(zone);
    gameAim={x:aim.x, z:aim.z};
    $('throw-btn').disabled=false;
  });
  $('throw-btn').addEventListener('click', ()=>{
    if(view!=='game' || game.phase!=='ready' || !game.aimZone) return;
    throwGamePitch(game.aimZone);
  });

  function throwGamePitch(zone){
    const base=GAME_PITCH_MAP[gamePitch];
    game.pa.hands=curHands();
    const rec=E.throwPitch(TABLE, game.pa, {pitchType:gamePitch, zone:zone}, {judge:absJudge, scout:game.scout, batter:LINEUP[game.batterIdx%9].type});
    const sgn=lefty?-1:1;
    const aim=E.zoneTarget(zone);
    gameAim={x:aim.x, z:aim.z};
    // 노림(tx/ty)은 조준 표시, 실제 도달(ax/ay)은 실투가 반영된 점. sgn 은 ballWorldFor 가 다시 곱하므로 미리 나눔
    cur=Object.assign({}, base, {tx:aim.x*sgn, ty:aim.z, ax:rec.x*sgn, ay:rec.z});
    game.rec=rec; rec.side = batLefty ? 1 : -1; rec.hands = game.pa.hands; rec.batter = LINEUP[game.batterIdx%9].name;
    game.phase='flying';
    game.aimZone=null;
    $('throw-btn').disabled=true;
    game.entry=null; game.entered=false; game.contacted=false; game.hit=null; game.swingEnd=false;
    $('game-msg').style.display='none';
    doThrow('real');
    game.t0=throwT;
    // 앞면(투수 쪽) 통과점 — 배트가 맞히는 평면
    const w=ballWorldFor(cur, 1-PLATE_D/RELEASE_D, knSeed);
    game.entry={X:w.X, Y:w.Y};
  }

  // 스윙 진행: raw(비행 진행률) 0.74~1.19 사이. 앞면 통과(raw≈0.975)에서 배트가 플레이트를 가로지름
  const SW0=0.74, SW1=1.19, RAW_ENTRY=1-PLATE_D/RELEASE_D;
  function swingTheta(raw){
    const u=Math.min(1,Math.max(0,(raw-SW0)/(SW1-SW0)));
    const e=u*u*(3-2*u);
    return (10+150*e)*Math.PI/180;
  }
  function flightRaw(){ return (performance.now()-game.t0)/flightDur(); }

  // 매 프레임 (drawFront 뒤에 호출)
  function gameFrame(){
    const rec=game.rec;
    if(game.phase==='ready' || game.phase==='flying') drawOuterZones();
    drawFarGrid();
    if(game.phase==='flying' && rec){
      const raw=flightRaw();
      if(!game.entered && raw>=RAW_ENTRY) game.entered=true;
      const contactResult = rec.swung && rec.result!=='whiff';
      if(contactResult && !game.contacted && raw>=RAW_ENTRY){
        // 배트에 맞음: 비행을 앞면에서 멈추고(궤적은 남김) 타구를 띄운다
        game.contacted=true;
        const wE=ballWorldFor(cur, RAW_ENTRY, knSeed);
        if(!path.length || path[path.length-1].d>PLATE_D+0.01) pushPath(wE);
        pathDone=true; throwT=-1;
        absCross=null;
        startHit(rec.result);
        onArrive();
      } else if(!contactResult && pathDone){
        onArrive();
      }
    }
    if(rec){
      if(game.entered) drawEntryMark(rec);
      if(game.phase!=='flying' || flightRaw()>=SW0) drawExpectMark(rec);
      if(rec.swung && (game.phase!=='flying' || flightRaw()>=SW0)) drawBat(rec);
      if(game.hit) drawHit();
    }
  }

  // 앞면(투수 쪽)에도 9분할 — 배트가 찍히는 면
  function drawFarGrid(){
    const P=(x,y)=>proj(x,y,PLATE_D);
    const lerp=(a,b,t)=>({x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t});
    const TL=P(-ZONE_W/2,ZONE_TOP), TR=P(ZONE_W/2,ZONE_TOP), BL=P(-ZONE_W/2,ZONE_BOT), BR=P(ZONE_W/2,ZONE_BOT);
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,0.09)'; ctx.lineWidth=1;
    ctx.beginPath();
    for(const t of [1/3,2/3]){
      const tp=lerp(TL,TR,t), bp=lerp(BL,BR,t); ctx.moveTo(tp.x,tp.y); ctx.lineTo(bp.x,bp.y);
      const lp=lerp(TL,BL,t), rp=lerp(TR,BR,t); ctx.moveTo(lp.x,lp.y); ctx.lineTo(rp.x,rp.y);
    }
    ctx.stroke();
    ctx.restore();
  }

  // 앞면 통과점: 들어온 칸 초록 칠 + 링. (뒷면 도달점은 도감 ABS 마커가 그림)
  function drawEntryMark(rec){
    const e=game.entry; if(!e) return;
    const inZone = Math.abs(e.X)<=ZONE_W/2 && e.Y>=ZONE_BOT && e.Y<=ZONE_TOP;
    ctx.save();
    if(inZone){
      const cw=ZONE_W/3, chh=(ZONE_TOP-ZONE_BOT)/3;
      const ci=Math.min(2,Math.max(0,Math.floor((e.X+ZONE_W/2)/cw)));
      const ri=Math.min(2,Math.max(0,Math.floor((ZONE_TOP-e.Y)/chh)));
      const x0=-ZONE_W/2+ci*cw, y1=ZONE_TOP-ri*chh, y0=y1-chh;
      const A=proj(x0,y1,PLATE_D), B=proj(x0+cw,y1,PLATE_D), C=proj(x0+cw,y0,PLATE_D), D=proj(x0,y0,PLATE_D);
      ctx.fillStyle='rgba(82,224,122,0.13)';
      ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.lineTo(C.x,C.y); ctx.lineTo(D.x,D.y); ctx.closePath(); ctx.fill();
    }
    const p=proj(e.X,e.Y,PLATE_D);
    const r=Math.max(3,BALL_R_M*p.s);
    ctx.strokeStyle=inZone?'rgba(82,224,122,0.8)':'rgba(255,90,90,0.8)';
    ctx.lineWidth=1.5; ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // 타자가 노린 곳 — 갈색 반투명 표시 (던지고 난 뒤에만)
  function drawExpectMark(rec){
    const ex=rec.expect; if(!ex) return;
    const p=proj(ex.x,ex.z,PLATE_D);
    const r=Math.max(8,BALL_R_M*p.s*2.2);
    ctx.save();
    ctx.fillStyle='rgba(150,100,55,0.28)';
    ctx.strokeStyle='rgba(190,135,80,0.75)';
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(230,190,140,0.9)';
    ctx.font='700 10px -apple-system,sans-serif'; ctx.textAlign='center';
    ctx.fillText('타자 노림 · '+E.GROUP_KO[ex.group], p.x, p.y-r-5);
    ctx.restore();
  }

  // 반투명 배트 — 노린 높이(맞았으면 공 높이)로 앞면을 가로질러 휘두름. 굵기 = 공 지름, 원근 유지
  function drawBat(rec){
    const side = rec.side || (batLefty ? 1 : -1);
    const raw = game.phase==='flying' ? flightRaw() : RAW_ENTRY;
    const zb = game.contacted && game.entry ? game.entry.Y : rec.expect ? rec.expect.z : (ZONE_TOP+ZONE_BOT)/2;
    const K={x:side*0.62, y:zb+0.12, d:PLATE_D+0.10}, L=0.85;
    const pose=(th)=>({x:K.x-side*L*Math.sin(th), y:zb, d:K.d-L*Math.cos(th)});
    const draw=(th,alpha)=>{
      const T=pose(th);
      const dK=Math.max(K.d,-CAM_BEHIND*0.8), dT=Math.max(T.d,-CAM_BEHIND*0.8);
      const a=proj(K.x,K.y,dK), b=proj(T.x,T.y,dT);
      const wa=BALL_R_M*a.s*0.6, wb=BALL_R_M*b.s;     // 손잡이 가늘게, 배럴 = 공 지름
      const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
      const nx=-dy/len, ny=dx/len;
      ctx.beginPath();
      ctx.moveTo(a.x+nx*wa,a.y+ny*wa); ctx.lineTo(b.x+nx*wb,b.y+ny*wb);
      ctx.lineTo(b.x-nx*wb,b.y-ny*wb); ctx.lineTo(a.x-nx*wa,a.y-ny*wa); ctx.closePath();
      ctx.fillStyle='rgba(160,108,60,'+alpha+')'; ctx.fill();
      ctx.strokeStyle='rgba(90,55,25,'+(alpha*0.9)+')'; ctx.lineWidth=1; ctx.stroke();
    };
    ctx.save();
    const swinging = game.phase==='flying' && raw<SW1;
    const thNow = swinging ? swingTheta(raw) : Math.PI/2;   // 끝나면 접촉 자세로 찍힘
    if(swinging) for(let g=3; g>=1; g--) draw(Math.max(10*Math.PI/180, thNow-g*0.22), 0.10*g);
    draw(thNow, swinging ? 0.55 : 0.40);
    ctx.restore();
  }

  // 맞은 공 — 앞면 통과점에서 결과에 맞는 방향으로 날아감
  function startHit(result){
    const e=game.entry, side=batLefty?1:-1, rnd=(a,b)=>a+Math.random()*(b-a);
    let v;
    if(result==='foul')        v={vx:rnd(-4,4)-side*2, vz:rnd(5,9), vd:-7};
    else if(result==='out')    v={vx:rnd(-9,9), vz:rnd(4,9), vd:18};
    else if(result==='single') v={vx:rnd(-8,8), vz:rnd(1.5,3.5), vd:24};
    else if(result==='double') v={vx:(Math.random()<0.5?-1:1)*rnd(9,13), vz:rnd(4,6), vd:26};
    else                       v={vx:rnd(-6,6), vz:rnd(10,13), vd:24};   // 홈런
    game.hit=Object.assign({t0:performance.now(), x:e.X, z:e.Y, d:PLATE_D, result}, v);
  }
  function drawHit(){
    const h=game.hit, t=(performance.now()-h.t0)/1000;
    if(t>1.8) return;
    const x=h.x+h.vx*t, d=h.d+h.vd*t, z=Math.max(0, h.z+h.vz*t-4.9*t*t);
    if(d<-CAM_BEHIND*0.8) return;
    if(z<=0 && h.result!=='hr' && t>0.3) return;      // 땅에 닿으면 끝
    const p=proj(x,z,d), r=Math.max(2,BALL_R_M*p.s);
    // 그림자
    const sh=proj(x,0,d);
    ctx.save(); ctx.globalAlpha=0.3; ctx.fillStyle='#000';
    ctx.beginPath(); ctx.ellipse(sh.x,sh.y,r*1.4,r*0.4,0,0,Math.PI*2); ctx.fill(); ctx.restore();
    drawBallSpin(p.x,p.y,r,performance.now());
  }

  function drawOuterZones(){
    const g=E.ZONE_GEOM, m=0.17;
    const L=-g.halfW-m, R=g.halfW+m, B=g.bot-m, T=g.top+m, mid=(g.top+g.bot)/2;
    const P=(x,y)=>proj(x,y,0);
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,0.13)'; ctx.lineWidth=1; ctx.setLineDash([3,5]);
    const a=P(L,T), b=P(R,T), c=P(R,B), d=P(L,B);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y); ctx.closePath(); ctx.stroke();
    // 사분면 경계 (존 가장자리 → 바깥)
    const pairs=[[0,T,0,g.top],[0,B,0,g.bot],[L,mid,-g.halfW,mid],[R,mid,g.halfW,mid]];
    ctx.beginPath();
    for(const [x1,y1,x2,y2] of pairs){ const p1=P(x1,y1), p2=P(x2,y2); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  function zoneName(zone){
    const inside = (batLefty ? 1 : -1);   // 타자 몸쪽이 화면 어느 쪽인지 (우타=왼쪽)
    if(zone<=9){
      const row=Math.floor((zone-1)/3), col=(zone-1)%3;
      const h=['높은','가운데','낮은'][row];
      const sideTxt = col===1 ? '한가운데' : ((col===0 ? -1 : 1)===inside ? '몸쪽' : '바깥쪽');
      return h+' '+sideTxt;
    }
    const up = zone===11||zone===12, left = zone===11||zone===13;
    return (up?'높은':'낮은')+' 존 밖 '+((left?-1:1)===inside ? '몸쪽':'바깥쪽');
  }
  function onArrive(){
    const rec=game.rec, inn=game.inning;
    game.entered=true;
    if(!path.length) pushPath(ballWorld(1));   // 화면이 가려져 비행 프레임을 놓쳤어도 도착점은 그린다
    if(!game.contacted) absCross={X:rec.x, Y:rec.z, strike:absJudge(rec.x,rec.z)};
    const [main,sub0]=RESULT_TXT[rec.result];
    const exTxt = rec.expect ? '타자는 '+E.GROUP_KO[rec.expect.group]+' '+zoneName(rec.expect.zone)+' 노림' : '';
    let text=main, subText=sub0 ? sub0+' · '+exTxt : exTxt, col=RESULT_COL[rec.result];
    if(rec.outcome){
      const runs=E.applyOutcome(inn, rec.outcome);
      if(rec.outcome==='walk'||rec.outcome==='strikeout'){ text=RESULT_TXT[rec.outcome][0]; col=RESULT_COL[rec.outcome]; }
      const status=E.gameStatus(game.g);
      subText = (runs ? runs+'실점 · '+game.g.us+':'+(game.g.them+inn.runs) : inn.outs+'아웃') + (exTxt ? ' · '+exTxt : '');
      if(status==='win'||status==='lose'||status==='draw'){
        game.phase='over';
        saveRecord(status);
        showMsg(text, subText, col);
        updateHUD();
        clearTimeout(game.endTimer);
        game.endTimer=setTimeout(showEnd, 1100);
        return;
      }
      if(status==='tied'){
        // 동점으로 이닝 종료 → 우리 공격(확률) → 다음 이닝 승부치기
        const top=E.nextInning(game.g);
        game.inning=game.g.inn;
        const n=game.inning.inning;
        text='동점 · '+n+'회로';
        subText=n+'회초 우리 공격 '+(top?top+'점':'무득점')+' → '+game.g.us+':'+game.g.them+' · '+n+'회말 무사 2루';
        col='#ffd23b';
      }
      game.batterIdx++;
      game.pa=E.startPA(curHands());
      batLefty = batHand(game.batterIdx)==='L';
      updateMatchup();
    }
    showMsg(text, subText, col);
    game.phase='ready';
    updateHUD();
  }

  function showEnd(){
    if(view!=='game') return;   // 다른 탭이면 돌아올 때 enterGame 이 보여줌
    const g=game.g, inn=game.inning, status=E.gameStatus(g);
    const them=g.them+inn.runs;
    const end=$('game-end');
    const title = status==='win' ? 'WIN' : status==='lose' ? 'LOSE' : 'DRAW';
    const col = status==='win' ? '#52e07a' : status==='lose' ? '#ff5a5a' : '#ffd23b';
    end.querySelector('.ge-title').textContent = title;
    end.querySelector('.ge-title').style.color = col;
    const where = inn.inning+'회말';
    end.querySelector('.ge-sub').innerHTML = status==='win'
      ? where+' 종료 — '+g.us+' : '+them+' 승리'
      : status==='lose' ? where+' 끝내기 — '+g.us+' : '+them+' 패배'
      : '12회까지 '+g.us+' : '+them+' — 무승부';
    const rec=loadRecord();
    end.querySelector('.ge-rec').textContent = '통산 '+rec.win+'승 '+rec.lose+'패'+(rec.draw?' '+rec.draw+'무':'')+(rec.streak>1?' · '+rec.streak+'연승':'');
    // 이번 판에 맞은 공 → 도감에서 보기
    const hits=game.scout.filter(r=>r.outcome==='single'||r.outcome==='double'||r.outcome==='hr').slice(-3);
    const box=end.querySelector('.ge-hits'); box.innerHTML='';
    if(hits.length){
      const lb=document.createElement('div'); lb.className='lb'; lb.textContent='맞은 공 — 도감에서 보기'; box.appendChild(lb);
      for(const r of hits){
        const b=document.createElement('button'); b.className='ge-hit';
        const nm=GAME_PITCH_MAP[r.pitchType].name.split(' ')[0];
        b.innerHTML=nm+' '+zoneNameFor(r.zone, r.hands[1]==='L')+' → '+RESULT_TXT[r.outcome][0]+' ('+r.batter+')<span>도감 ›</span>';
        b.addEventListener('click', ()=>openInDex(r));
        box.appendChild(b);
      }
    }
    end.style.display='flex';
    $('game-msg').style.display='none';
  }
  function zoneNameFor(zone, batL){ const keep=batLefty; batLefty=batL; const t=zoneName(zone); batLefty=keep; return t; }

  // ── 통산 기록 (localStorage) ──
  const REC_KEY='pb_inning_record';
  function loadRecord(){ try{ return Object.assign({win:0,lose:0,draw:0,streak:0,best:0}, JSON.parse(localStorage.getItem(REC_KEY)||'{}')); }catch(e){ return {win:0,lose:0,draw:0,streak:0,best:0}; } }
  function saveRecord(status){
    const r=loadRecord();
    r[status]=(r[status]||0)+1;
    r.streak = status==='win' ? (r.streak||0)+1 : 0;
    r.best = Math.max(r.best||0, r.streak);
    try{ localStorage.setItem(REC_KEY, JSON.stringify(r)); }catch(e){}
  }

  // ── 맞은 공을 도감 타자 시점에서 열기: 같은 구종·같은 좌우·같은 칸 ──
  function openInDex(r){
    const p=GAME_PITCH_MAP[r.pitchType];
    dexCur=p;                                   // 탭 전환 때 leaveGame 이 cur=dexCur 로 되돌리므로 먼저 지정
    lefty = r.hands[0]==='L'; batLefty = r.hands[1]==='L';
    document.querySelector('.tab[data-v=front]').click();
    document.querySelectorAll('#pitch-bar .p-chip').forEach(c=>c.classList.toggle('on', c.textContent===p.name.split(' ')[0]));
    const t=E.zoneTarget(r.zone); dexAim={x:t.x, z:t.z};
    updateMatchup(); updateInfo();
    doThrow('real');
  }
  $('game-again').addEventListener('click', ()=>newGame());
  $('game-team').addEventListener('click', ()=>{ game.inning=null; showSetup(); });

  // ═════ 도감 타자 시점: 실측으로 "어디가 좋은가 · 이 조합 · 앞에 뭘 던지나" ═════
  const DEX_CODE={ '4seam':'FF', '2seam':'SI', 'cutter':'FC', 'slider':'SL', 'sweeper':'ST', 'curve':'CU', 'change':'CH', 'splitter':'FS', 'sinker':'SI', 'kcurve':'KC', 'slurve':'SV' };
  const PT_KO={ FF:'포심', SI:'싱커', FC:'커터', SL:'슬라이더', ST:'스위퍼', CU:'커브', KC:'너클커브', CH:'체인지업', FS:'스플리터', SV:'슬러브' };
  let heatCache={ key:'', scores:null, best:null, lo:0, hi:1 };
  function dexHeat(){
    const code=DEX_CODE[cur.key]; if(!code || !TABLE) return null;
    const key=code+'|'+matchKey();
    if(heatCache.key!==key){
      const sc=E.zoneScores(TABLE, code, matchKey(), 'count');     // 색·★ = 카운트 잡기
      const fin=E.zoneScores(TABLE, code, matchKey(), 'finish');   // ◆ = 결정구 (2스트라이크)
      let lo=Infinity, hi=-Infinity, lo2=Infinity, hi2=-Infinity, best=null, bestFin=null;
      for(const z of E.ZONES){ const v=sc[z];
        if(z<=9){ if(v<lo) lo=v; if(v>hi) hi=v; } else { if(v<lo2) lo2=v; if(v>hi2) hi2=v; }
        if(best===null||v>sc[best]) best=z;
        if(bestFin===null||fin[z]>fin[bestFin]) bestFin=z; }
      heatCache={ key, scores:sc, best, bestFin, lo, hi, lo2, hi2 };
    }
    return heatCache;
  }
  function dexSummary(){
    const h=dexHeat(); const pT=lefty?'좌투':'우투', bT=batLefty?'좌타':'우타';
    if(!h) return '<span class="dim">'+pT+' vs '+bT+' · 실측 없음 (너클볼)</span>';
    const code=DEX_CODE[cur.key];
    const m=E.matchupRating(TABLE, code, matchKey());
    const pv=E.prevAdvice(TABLE, code, matchKey());
    const arrow = m.label==='유리' ? '▲' : m.label==='불리' ? '▼' : '=';
    const line1 = (h.best===h.bestFin)
      ? '<b>★◆ '+zoneName(h.best)+'</b> <span class="dim">· '+arrow+' '+m.label+'</span>'
      : '<b>★ '+zoneName(h.best)+'</b> <span class="dim">·</span> <b>◆ '+zoneName(h.bestFin)+'</b> <span class="dim">· '+arrow+' '+m.label+'</span>';
    const line2=pv.length ? '<span class="dim">앞 공:</span> '+pv.map(x=>PT_KO[x.prev]).join(' · ')
                          : '<span class="dim">앞 공 영향 작음</span>';
    return line1+'<br>'+line2+'<br><span class="dim" style="font-size:10px">★ 카운트 잡기 · ◆ 결정구(2S)</span>';
  }
  // 존 앞면 9칸 + 밖 4칸(ㄱ자)에 점수 색. 진한 초록 = 투수에게 좋음, 붉음 = 나쁨. ★ = 최고 칸
  function drawZoneHeat(){
    const h=dexHeat(); if(!h) return;
    const g=E.ZONE_GEOM, m=0.17, mid=(g.top+g.bot)/2;
    const col=(z)=>{ const inZ=z<=9, lo=inZ?h.lo:h.lo2, hi=inZ?h.hi:h.hi2;
      const t=(hi>lo)?(h.scores[z]-lo)/(hi-lo):0.5;
      const r=Math.round(255+(82-255)*t), gg=Math.round(90+(224-90)*t), b=Math.round(90+(122-90)*t);
      return 'rgba('+r+','+gg+','+b+','+(inZ?0.24:0.10)+')'; };
    const quad=(pts,fill)=>{ ctx.beginPath(); pts.forEach((q,i)=>{ const p=proj(q[0],q[1],0); i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); }); ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); };
    ctx.save();
    const cw=ZONE_W/3, chh=(ZONE_TOP-ZONE_BOT)/3;
    for(let z=1; z<=9; z++){
      const c=(z-1)%3, r=Math.floor((z-1)/3);
      const x0=-ZONE_W/2+c*cw, y1=ZONE_TOP-r*chh;
      quad([[x0,y1],[x0+cw,y1],[x0+cw,y1-chh],[x0,y1-chh]], col(z));
    }
    // 밖 4칸: 위/아래 띠 + 옆 띠 (ㄱ자)
    const L=-g.halfW-m, R=g.halfW+m, B=g.bot-m, T=g.top+m;
    quad([[L,T],[0,T],[0,g.top],[L,g.top]], col(11)); quad([[L,g.top],[-g.halfW,g.top],[-g.halfW,mid],[L,mid]], col(11));
    quad([[0,T],[R,T],[R,g.top],[0,g.top]], col(12));  quad([[g.halfW,g.top],[R,g.top],[R,mid],[g.halfW,mid]], col(12));
    quad([[L,g.bot],[0,g.bot],[0,B],[L,B]], col(13));  quad([[L,mid],[-g.halfW,mid],[-g.halfW,g.bot],[L,g.bot]], col(13));
    quad([[0,g.bot],[R,g.bot],[R,B],[0,B]], col(14));  quad([[g.halfW,mid],[R,mid],[R,g.bot],[g.halfW,g.bot]], col(14));
    // ★ 카운트 잡기 최고 칸 · ◆ 결정구(2S) 최고 칸
    ctx.font='800 15px -apple-system,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor='rgba(0,0,0,0.8)'; ctx.shadowBlur=4;
    const bt=E.zoneTarget(h.best), bp=proj(bt.x,bt.z,0);
    const ft=E.zoneTarget(h.bestFin), fp=proj(ft.x,ft.z,0);
    if(h.best===h.bestFin){ ctx.fillStyle='rgba(255,210,59,0.95)'; ctx.fillText('★◆', bp.x, bp.y); }
    else {
      ctx.fillStyle='rgba(255,210,59,0.95)'; ctx.fillText('★', bp.x, bp.y);
      ctx.fillStyle='rgba(255,140,90,0.95)'; ctx.fillText('◆', fp.x, fp.y);
    }
    ctx.restore();
  }
  window.__pb={ get game(){return game;}, tapToZone, throwGamePitch, get W(){return W;}, get H(){return H;},
    step(){ if(game.phase==='flying'){ pathDone=true; onArrive(); } } };  // 디버그용
  $('hand-btn').addEventListener('click', ()=>{ if(view==='game' && game.inning) updateHUD(); });

  $('page').classList.add('front');
  resize();
  updateInfo();
  updateMatchup();
  doThrow('study');
  loop();
})();
</script>
